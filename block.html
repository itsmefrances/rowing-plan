<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Block Console — Week 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --ground:#F1F3F5; --surface:#FFF; --surface-2:#E8ECEF; --surface-3:#DDE3E8;
  --ink:#14171B; --ink-2:#3C444D; --muted:#69727B;
  --rule:#D3DAE0; --rule-strong:#B5BFC8;
  --erg:#0C6F6B; --erg-soft:#DBECEB; --erg-ink:#084F4C;
  --lift:#9A6510; --lift-soft:#F4E9D5; --lift-ink:#6E4809;
  --test:#B23D0B; --test-soft:#F8E2D7; --test-ink:#8A2F08;
  --ok:#1F7A44; --ok-soft:#DDF0E4;
  --warn:#9A6510; --warn-soft:#F4E9D5;
  --stop:#B02020; --stop-soft:#F8DEDE;
  --f-d:"Archivo","Helvetica Neue",Arial,sans-serif;
  --f-m:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#0F1216; --surface:#161A1F; --surface-2:#1E242B; --surface-3:#272E36;
  --ink:#E6EAEE; --ink-2:#B4BDC6; --muted:#8A949E;
  --rule:#293039; --rule-strong:#39424D;
  --erg:#3FB3AC; --erg-soft:#11302F; --erg-ink:#7FD3CD;
  --lift:#D9A03F; --lift-soft:#2D2414; --lift-ink:#EBC078;
  --test:#E8733C; --test-soft:#33190E; --test-ink:#F19E75;
  --ok:#4FBE7C; --ok-soft:#13301F;
  --warn:#D9A03F; --warn-soft:#2D2414;
  --stop:#E86060; --stop-soft:#331616;
}}
:root[data-theme="dark"]{
  --ground:#0F1216; --surface:#161A1F; --surface-2:#1E242B; --surface-3:#272E36;
  --ink:#E6EAEE; --ink-2:#B4BDC6; --muted:#8A949E;
  --rule:#293039; --rule-strong:#39424D;
  --erg:#3FB3AC; --erg-soft:#11302F; --erg-ink:#7FD3CD;
  --lift:#D9A03F; --lift-soft:#2D2414; --lift-ink:#EBC078;
  --test:#E8733C; --test-soft:#33190E; --test-ink:#F19E75;
  --ok:#4FBE7C; --ok-soft:#13301F;
  --warn:#D9A03F; --warn-soft:#2D2414;
  --stop:#E86060; --stop-soft:#331616;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--ground);color:var(--ink);
  font-family:var(--f-d);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;}
.wrap{max-width:820px;margin:0 auto;padding:16px 14px 60px;}
h1,h2,h3{margin:0;line-height:1.15;text-wrap:balance;}
h1{font-size:23px;font-weight:700;letter-spacing:-0.015em;}
h2{font-size:16px;font-weight:700;letter-spacing:-0.005em;}
h3{font-size:13.5px;font-weight:600;}
p{margin:0;}
.mono{font-family:var(--f-m);font-variant-numeric:tabular-nums;}
.eyebrow{font-size:10px;font-weight:600;letter-spacing:0.13em;text-transform:uppercase;color:var(--muted);}
.row{display:flex;align-items:center;gap:10px;}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.stack{display:flex;flex-direction:column;gap:14px;}
.stack-s{display:flex;flex-direction:column;gap:7px;}

/* top */
header{border-bottom:2px solid var(--rule-strong);padding-bottom:12px;margin-bottom:16px;}
.hrow{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;}
.sample-note{
  margin-top:10px;background:var(--test-soft);border-left:3px solid var(--test);
  padding:9px 12px;font-size:13px;color:var(--ink);
}

/* panels */
.panel{background:var(--surface);border:1px solid var(--rule);margin-bottom:14px;}
.panel-h{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:10px 13px;background:var(--surface-2);border-bottom:1px solid var(--rule);
  cursor:pointer;user-select:none;width:100%;text-align:left;border-left:0;border-right:0;border-top:0;
  font-family:var(--f-d);color:var(--ink);
}
.panel-h:focus-visible{outline:2px solid var(--erg);outline-offset:-2px;}
.panel-b{padding:13px;}
.caret{font-family:var(--f-m);font-size:11px;color:var(--muted);}

/* chips */
.chip{display:inline-flex;align-items:center;gap:4px;font-size:9.5px;font-weight:600;
  letter-spacing:0.08em;text-transform:uppercase;padding:2px 7px;border-radius:3px;white-space:nowrap;}
.chip.erg{background:var(--erg-soft);color:var(--erg-ink);}
.chip.lift{background:var(--lift-soft);color:var(--lift-ink);}
.chip.test{background:var(--test-soft);color:var(--test-ink);}
.chip.done{background:var(--ok-soft);color:var(--ok);}

/* day strip */
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:14px;}
.dbtn{
  display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px;
  background:var(--surface);border:1px solid var(--rule);cursor:pointer;
  font-family:var(--f-d);color:var(--ink-2);
}
.dbtn:focus-visible{outline:2px solid var(--erg);outline-offset:1px;}
.dbtn .dn{font-size:9.5px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:var(--muted);}
.dbtn .dd{font-family:var(--f-m);font-size:14px;font-weight:500;}
.dbtn .dot{width:5px;height:5px;border-radius:50%;background:var(--rule-strong);}
.dbtn[data-k="erg"] .dot{background:var(--erg);}
.dbtn[data-k="lift"] .dot{background:var(--lift);}
.dbtn[aria-selected="true"]{background:var(--ink);border-color:var(--ink);}
.dbtn[aria-selected="true"] .dn,.dbtn[aria-selected="true"] .dd{color:var(--ground);}
.dbtn.is-today{border-color:var(--ink);border-width:2px;}
.dbtn.is-done .dd{color:var(--ok);}

/* session */
.sess-h{padding:13px;border-bottom:1px solid var(--rule);display:flex;flex-direction:column;gap:6px;}
.sess-h .t{font-size:18px;font-weight:700;letter-spacing:-0.01em;}
.sess-h .d{font-family:var(--f-m);font-size:12px;color:var(--muted);}

/* erg block */
.erg-txt{
  font-family:var(--f-m);font-size:12.5px;line-height:1.65;color:var(--ink-2);
  white-space:pre-wrap;background:var(--surface-2);padding:11px;border-left:3px solid var(--erg);
}
.paceband{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:1px;
  background:var(--rule);border:1px solid var(--rule);margin-top:11px;}
.pb{background:var(--surface);padding:9px 11px;display:flex;flex-direction:column;gap:2px;}
.pb .k{font-size:9.5px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted);}
.pb .v{font-family:var(--f-m);font-size:16px;font-weight:600;}
.pb .s{font-family:var(--f-m);font-size:11px;color:var(--muted);}

/* exercise rows */
.ex{border-bottom:1px solid var(--rule);padding:11px 13px;display:flex;flex-direction:column;gap:8px;}
.ex:last-child{border-bottom:0;}
.ex.cut{opacity:.42;}
.ex.cut .exname{text-decoration:line-through;}
.ex-top{display:flex;align-items:flex-start;gap:10px;}
.slot{font-family:var(--f-m);font-size:11px;color:var(--muted);width:20px;flex:0 0 20px;padding-top:2px;}
.ex-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;}
.exname{font-size:14.5px;font-weight:600;}
.exrx{font-family:var(--f-m);font-size:12.5px;color:var(--ink-2);}
.exload{font-family:var(--f-m);font-size:15px;font-weight:600;color:var(--lift);}
.exnote{font-size:12.5px;color:var(--muted);}
.foldbtn{flex:0 0 20px;width:20px;height:20px;padding:0;line-height:1;cursor:pointer;
  background:none;border:1px solid var(--rule-strong);color:var(--muted);
  font-family:var(--f-d);font-size:9.5px;}
.foldbtn:hover{border-color:var(--lift);color:var(--lift-ink);}
.foldbtn:focus-visible{outline:2px solid var(--erg);outline-offset:1px;}
.ex.folded .exload,.ex.folded .exrx,.ex.folded .exrir,.ex.folded .cutflag,
.ex.folded .prog,.ex.folded .logline{display:none;}
.ex.star{background:var(--lift-soft);}
.ex.star .exname::before{content:"★ ";color:var(--lift);}
.cutflag{font-size:11px;font-weight:600;color:var(--stop);}

/* log inputs */
.logline{display:flex;flex-wrap:wrap;gap:6px;align-items:center;}
input[type=text],input[type=number]{
  font-family:var(--f-m);font-size:13px;padding:5px 7px;background:var(--surface);
  border:1px solid var(--rule-strong);color:var(--ink);width:70px;border-radius:0;
}
input:focus-visible{outline:2px solid var(--erg);outline-offset:-1px;}
input.wide{width:100%;min-width:120px;}
label.inl{font-size:11px;font-weight:600;letter-spacing:0.05em;text-transform:uppercase;color:var(--muted);}
.cbx{display:flex;align-items:center;gap:7px;cursor:pointer;font-size:13px;}
.cbx input{width:17px;height:17px;accent-color:var(--ok);}

/* buttons */
button.b{
  font-family:var(--f-d);font-size:13px;font-weight:600;padding:8px 14px;cursor:pointer;
  background:var(--ink);color:var(--ground);border:1px solid var(--ink);
}
button.b.ghost{background:transparent;color:var(--ink);border-color:var(--rule-strong);}
button.b:focus-visible{outline:2px solid var(--erg);outline-offset:2px;}
button.b:disabled{opacity:.45;cursor:default;}

/* readiness */
.gate{padding:13px;border-bottom:1px solid var(--rule);background:var(--surface-2);}
.verdict{margin-top:10px;padding:10px 12px;border-left:3px solid var(--rule-strong);
  display:flex;flex-direction:column;gap:3px;}
.verdict.g{background:var(--ok-soft);border-left-color:var(--ok);}
.verdict.a{background:var(--warn-soft);border-left-color:var(--warn);}
.verdict.r{background:var(--stop-soft);border-left-color:var(--stop);}
.verdict .vt{font-size:14px;font-weight:700;}
.verdict .vd{font-size:13px;color:var(--ink-2);}

/* maxes grid */
.mx{display:grid;grid-template-columns:repeat(auto-fit,minmax(122px,1fr));gap:9px;}
.mxi{display:flex;flex-direction:column;gap:3px;}
.mxi label{font-size:10px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted);}
.mxi input{width:100%;}

/* toggle */
.seg{display:inline-flex;border:1px solid var(--rule-strong);}
.seg button{
  font-family:var(--f-d);font-size:12px;font-weight:600;padding:6px 11px;cursor:pointer;
  background:var(--surface);color:var(--ink-2);border:0;border-right:1px solid var(--rule-strong);
}
.seg button:last-child{border-right:0;}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--ground);}
.seg button:focus-visible{outline:2px solid var(--erg);outline-offset:-2px;}

/* trends */
.tr{display:grid;grid-template-columns:1fr;gap:11px;}
@media(min-width:620px){.tr{grid-template-columns:1fr 1fr 1fr;}}
.trc{border:1px solid var(--rule);padding:11px;background:var(--surface);display:flex;flex-direction:column;gap:6px;}
.trc .tk{font-size:10px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted);}
.trc .tv{font-family:var(--f-m);font-size:20px;font-weight:600;}
.trc .tb{font-family:var(--f-m);font-size:11px;color:var(--muted);}
svg.spark{width:100%;height:38px;display:block;}

/* ergzone */
.ez{border:1px solid var(--rule);margin-bottom:11px;}
.ez-h{background:var(--surface-2);padding:9px 12px;border-bottom:1px solid var(--rule);
  display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap;}
.ez-h .n{font-size:13.5px;font-weight:700;}
.ez-h .dt{font-family:var(--f-m);font-size:11.5px;color:var(--test);font-weight:600;}
.ezf{display:grid;grid-template-columns:96px 1fr;gap:0;border-bottom:1px solid var(--rule);}
.ezf:last-child{border-bottom:0;}
.ezf .k{font-size:10px;font-weight:600;letter-spacing:0.07em;text-transform:uppercase;
  color:var(--muted);padding:8px 10px;background:var(--surface-2);}
.ezf .v{font-family:var(--f-m);font-size:12.5px;padding:8px 10px;color:var(--ink-2);white-space:pre-wrap;}

.note{border-left:3px solid var(--rule-strong);padding:2px 0 2px 13px;color:var(--ink-2);font-size:13px;}
.note.w{border-left-color:var(--test);}
.status{font-family:var(--f-m);font-size:11px;color:var(--muted);}
.weeknav{display:flex;align-items:center;gap:6px;flex-wrap:wrap;}
.weeknav button{font-family:var(--f-d);font-size:13px;font-weight:600;line-height:1;
  background:var(--surface);color:var(--ink);border:1px solid var(--rule-strong);
  padding:7px 10px;cursor:pointer;min-width:34px;}
.weeknav button:disabled{opacity:.35;cursor:default;}
.weeknav button:focus-visible{outline:2px solid var(--erg);outline-offset:1px;}
.weeknav select{font-family:var(--f-m);font-size:13px;padding:6px 8px;
  background:var(--surface);color:var(--ink);border:1px solid var(--rule-strong);border-radius:0;
  max-width:min(62vw,260px);}
.weeknav .wnow{font-size:11px;font-weight:600;letter-spacing:0.06em;text-transform:uppercase;padding:7px 9px;}
.arow{display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:9px 0;border-bottom:1px solid var(--rule);}
.arow:last-child{border-bottom:0;}
.arow .al{display:flex;flex-direction:column;gap:2px;min-width:0;}
.arow .aw{font-size:13.5px;font-weight:600;}
.arow .as{font-family:var(--f-m);font-size:11.5px;color:var(--muted);}
.arow button{font-family:var(--f-d);font-size:12px;font-weight:600;color:var(--erg);
  background:none;border:1px solid var(--erg);padding:5px 9px;cursor:pointer;white-space:nowrap;}
.arow button:hover{background:var(--erg-soft);}
.nopub{padding:13px;display:flex;flex-direction:column;gap:6px;}
.prog{display:flex;flex-direction:column;gap:2px;padding:8px 10px;
  background:var(--surface-2);border-left:3px solid var(--lift);}
.prog .pk{font-size:9.5px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted);}
.prog .pv{font-family:var(--f-m);font-size:12.5px;color:var(--ink);}
.prog .pd{font-family:var(--f-m);font-size:12px;color:var(--lift-ink);}
.subline{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:7px 10px;
  border-top:1px dashed var(--rule);}
.subsel{font-family:var(--f-d);font-size:12.5px;color:var(--ink);background:var(--surface);
  border:1px solid var(--rule);padding:4px 6px;max-width:100%;}
.subint{font-size:11px;color:var(--muted);}
.subprev{font-family:var(--f-m);font-size:11.5px;color:var(--lift-ink);
  padding:0 10px 7px;}
.exsub{font-family:var(--f-m);font-size:12px;color:var(--lift-ink);}
.ex.folded .subline,.ex.folded .subprev{display:none;}
.maxlink{font-family:var(--f-d);font-size:12.5px;font-weight:600;color:var(--erg);text-decoration:none;
  border:1px solid var(--erg);padding:5px 9px;white-space:nowrap;}
.maxlink:hover{background:var(--erg-soft);}
.sets{display:flex;flex-direction:column;gap:5px;}
.setrow{display:grid;grid-template-columns:26px 1fr 1fr 1fr auto;gap:5px;align-items:center;}
.setrow .sn{font-family:var(--f-m);font-size:11px;color:var(--muted);text-align:right;}
.setrow input{width:100%;font-size:12.5px;padding:4px 6px;}
.addset{font-family:var(--f-d);font-size:11.5px;font-weight:600;color:var(--erg);background:none;
  border:0;cursor:pointer;padding:2px 0;text-align:left;}
.addset:focus-visible{outline:2px solid var(--erg);}
.logbtn{font-family:var(--f-d);font-size:12px;font-weight:600;padding:5px 11px;cursor:pointer;
  background:var(--ink);color:var(--ground);border:1px solid var(--ink);}
.logbtn:disabled{opacity:.4;cursor:default;}
.addbtn{font-family:var(--f-d);font-size:17px;font-weight:600;line-height:1;
  width:30px;height:30px;flex:0 0 30px;cursor:pointer;background:var(--surface);
  border:1px solid var(--rule-strong);color:var(--ink);}
.addbtn:hover{background:var(--lift-soft);border-color:var(--lift);color:var(--lift-ink);}
.addbtn:focus-visible{outline:2px solid var(--erg);outline-offset:1px;}
.exrir{font-family:var(--f-m);font-size:12px;color:var(--lift-ink);background:var(--lift-soft);
  padding:1px 6px;align-self:flex-start;}
.logged{font-family:var(--f-m);font-size:11.5px;color:var(--ok);}
.modal-bg{position:fixed;inset:0;background:rgba(8,10,13,.55);display:flex;align-items:center;
  justify-content:center;padding:16px;z-index:50;}
.modal{background:var(--surface);border:1px solid var(--rule-strong);max-width:380px;width:100%;
  display:flex;flex-direction:column;max-height:90vh;overflow:auto;}
.modal-h{padding:13px;border-bottom:1px solid var(--rule);display:flex;flex-direction:column;gap:3px;}
.modal-h .t{font-size:16px;font-weight:700;}
.modal-h .s{font-family:var(--f-m);font-size:12px;color:var(--muted);}
.modal-b{padding:13px;display:flex;flex-direction:column;gap:11px;}
.f{display:flex;flex-direction:column;gap:4px;}
.f label{font-size:10px;font-weight:600;letter-spacing:0.09em;text-transform:uppercase;color:var(--muted);}
.f input{width:100%;font-size:15px;padding:8px 9px;}
.f3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
.setgrid{display:grid;grid-template-columns:52px 1fr 1fr 1fr;gap:6px;align-items:center;}
.setgrid.h5{grid-template-columns:46px 1fr 1fr 1fr 1fr;gap:5px;}
.updbar{position:fixed;left:0;right:0;bottom:0;z-index:60;display:flex;gap:11px;
  align-items:center;justify-content:center;padding:11px 13px;
  background:var(--ink);color:var(--ground);
  font-family:var(--f-d);font-size:12.5px;font-weight:600;}
.updbar button{background:var(--ground);color:var(--ink);border:1px solid var(--ground);
  font-family:var(--f-d);font-size:12px;font-weight:600;padding:5px 11px;cursor:pointer;}
.setgrid.head .hl{font-size:9.5px;font-weight:600;letter-spacing:0.09em;text-transform:uppercase;color:var(--muted);}
.setgrid .sn{font-family:var(--f-m);font-size:11.5px;color:var(--muted);}
.setgrid input{width:100%;font-size:14px;padding:7px 8px;}
.modal-f{padding:13px;border-top:1px solid var(--rule);display:flex;gap:8px;justify-content:flex-end;}
.c2box,.prevbox{display:flex;flex-direction:column;gap:3px;padding:11px 13px;
  border-bottom:1px solid var(--rule);}
.c2box{background:var(--ok-soft);border-left:3px solid var(--ok);}
.prevbox{background:var(--surface-2);border-left:3px solid var(--rule-strong);border-bottom:0;}
.c2k{font-size:10px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted);}
.c2v{font-family:var(--f-m);font-size:13px;color:var(--ink);}
.c2d{font-family:var(--f-m);font-size:12px;color:var(--ink-2);}
.c2link{align-self:flex-start;margin-top:5px;font-family:var(--f-d);font-size:12px;
  font-weight:600;color:var(--erg);text-decoration:none;border-bottom:1px solid var(--erg);}
.c2link:hover{opacity:.75;}
.c2links{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:5px;}
.c2links .c2link{margin-top:0;}
.htools{display:flex;align-items:center;gap:9px;flex-wrap:wrap;justify-content:flex-end;}
.coachwrap{padding:13px;background:var(--ground);border-top:1px solid var(--rule);}
.coachbox{display:flex;flex-direction:column;gap:9px;padding:13px 14px;
  background:#14171B;border-radius:6px;}
.ceyebrow{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;
  font-family:var(--f-d);font-size:10px;font-weight:700;letter-spacing:0.13em;
  text-transform:uppercase;color:#7E8991;}
.ceyebrow b{color:#4FB3AC;}
.chead{font-family:var(--f-d);font-size:14px;font-weight:600;line-height:1.35;color:#FFF;}
.cpt{font-family:var(--f-m);font-size:12px;line-height:1.55;color:#BDC7CF;
  padding-left:14px;position:relative;}
.cpt:before{content:"\2014";position:absolute;left:0;color:#5A646D;}
.cwatch,.cnext{font-family:var(--f-m);font-size:12px;line-height:1.5;color:#DDE4EA;
  background:#1E242A;border-radius:4px;padding:7px 9px;}

<script>
"use strict";

/* ---------- constants ---------- */
var WEEK = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
var MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
var BLOCK_W1 = "2026-09-07";   /* Monday of week 1 */
var BLOCK_N  = 13;
function ymd(dt){ return dt.getFullYear() + "-" + String(dt.getMonth()+1).padStart(2,"0") + "-" + String(dt.getDate()).padStart(2,"0"); }
function addDays(iso, n){ var d = new Date(iso + "T12:00:00"); d.setDate(d.getDate() + n); return ymd(d); }
function todayISO(){ return ymd(new Date()); }
function weekStart(n){ return addDays(BLOCK_W1, (n-1)*7); }
function datesFor(n){ var s = weekStart(n), a = []; for(var i=0;i<7;i++) a.push(addDays(s,i)); return a; }
function fmtDay(iso){ return MON[Number(iso.slice(5,7))-1] + " " + Number(iso.slice(8)); }
function weekLabel(n){ return fmtDay(weekStart(n)) + " \u2013 " + fmtDay(addDays(weekStart(n),6)); }
function weekOf(iso){
  var diff = Math.round((new Date(iso+"T12:00:00") - new Date(BLOCK_W1+"T12:00:00")) / 86400000);
  return Math.floor(diff / 7) + 1;
}
/* the block week runs Mon-Sun. Saturday night it closes: from Sunday morning
   the console opens on the week ahead, and the week just run moves to Archive. */
function activeWeek(){
  var t = todayISO(), w = weekOf(t);
  if(new Date(t + "T12:00:00").getDay() === 0) w += 1;
  return Math.min(BLOCK_N, Math.max(1, w));
}
var DATES = datesFor(activeWeek());
var SUNDAY = DATES[6];

var state = {
  conv: "pace",
  pb: 99.9,          /* 500m PB in seconds — 1:39.9 */
  maxes: {squat:230, front:180, bench:135, ohp:95, dl:275, pull:50, bw:150},
  baseline: {cmj:0, broad:0, peak7:540},
  week: activeWeek(),
  sel: 0,
  log: {},
  fold: {},          /* date|exercise → collapsed to the title, set by hand only */
  sub: {},           /* date|exercise → what she swapped that slot for */
  rows: [],          /* sheet-shaped rows awaiting sync */
  metrics: {peak7:[], broad:[], cmj:[]}
};
var db = null, saveTimer = null;

/* ---------- helpers ---------- */
function r5(n){ return Math.round(n/5)*5; }
function fmtTime(sec){
  var m = Math.floor(sec/60), s = sec - m*60;
  return m + ":" + (s<10?"0":"") + s.toFixed(1);
}
/* Formulas lifted verbatim from Sumit Rai's Pace Calculator
   (conkers.eatonrise.com/rowcalc). Concept2 power law: W = 2.8 / (s/500)^3.
   Pace mode is LINEAR percent-off-PB — PB x (2 - pct) — not a speed ratio. */
function wattsFromSec(sec){ return 2.8 / Math.pow(sec/500, 3); }
function secFromWatts(w){ return 500 * Math.pow(2.8/w, 1/3); }
function basePower(){ return wattsFromSec(state.pb); }

function secFromPct(pct){                       /* pct as a fraction, e.g. 0.95 */
  var P = pct * 100;
  if(state.conv === "pace"){
    return state.pb * ((100 - P)/100 + 1);      /* adjustedTime = PB * (2 - P/100) */
  }
  return secFromWatts(Math.round(basePower() * (P/100)));
}
function band(lo, hi){
  var slow = secFromPct(lo), fast = secFromPct(hi);
  return {
    paceHi: fmtTime(slow),
    paceLo: fmtTime(fast),
    wLo: Math.round(wattsFromSec(slow)),
    wHi: Math.round(wattsFromSec(fast))
  };
}
function extLink(href, text){
  var a = document.createElement("a");
  a.className = "c2link"; a.href = href;
  a.target = "_blank"; a.rel = "noopener";
  a.textContent = text;
  return a;
}

function el(tag, cls, txt){
  var e = document.createElement(tag);
  if(cls) e.className = cls;
  if(txt != null) e.textContent = txt;
  return e;
}
function todayIdx(){ return DATES.indexOf(todayISO()); }
function setWeek(n){
  state.week = Math.min(BLOCK_N, Math.max(1, n));
  DATES = datesFor(state.week);
  SUNDAY = DATES[6];
  var i = DATES.indexOf(todayISO());
  state.sel = i < 0 ? 0 : i;
  render();
}
function weekHasPlan(n){
  var ds = datesFor(n);
  for(var i=0;i<7;i++){ if(SESSIONS[ds[i]]) return true; }
  return false;
}
function logFor(d){
  if(!state.log[d]) state.log[d] = {done:false, cmj:["","",""], entries:{}};
  return state.log[d];
}

/* ---------- Concept2 logbook (snapshot, rower only) ---------- */
/* [date, metres, elapsed, pace/500, rate, drag, type] */
var C2LOG = [
["2026-09-07",2000,"33:48.4","1:42.1",36,124,"VariableInterval"],
["2026-09-05",1399,"18:30.0","1:47.2",30,119,"VariableInterval"],
["2026-09-04",12662,"1:00:00.0","2:22.2",20,113,"FixedTimeSplits"],
["2026-08-31",10000,"53:04.3","2:21.2",20,115,"VariableInterval"],
["2026-08-30",2000,"7:56.1","1:59.0",27,115,"FixedDistanceSplits"],
["2026-08-29",320,"1:00.0","1:33.8",44,127,"FixedTimeSplits"],
["2026-08-28",400,"13:14.1","1:32.6",46,126,"VariableInterval"],
["2026-08-26",306,"1:00.0","1:38.0",44,120,"FixedTimeSplits"],
["2026-08-24",1000,"15:19.6","1:39.8",39,117,"FixedDistanceInterval"],
["2026-08-22",6000,"34:21.5","2:06.8",27,115,"FixedDistanceInterval"],
["2026-08-20",3960,"34:00.0","2:01.2",28,117,"VariableInterval"],
["2026-08-17",800,"9:44.0","1:42.5",37,118,"FixedDistanceInterval"],
["2026-08-14",4000,"20:37.5","2:19.7",22,121,"FixedDistanceInterval"],
["2026-08-12",4007,"28:00.0","1:59.8",29,117,"FixedTimeInterval"],
["2026-08-10",2000,"27:57.2","1:44.3",37,117,"FixedDistanceInterval"],
["2026-08-07",5873,"39:00.0","2:02.6",27,118,"VariableInterval"],
["2026-08-05",4000,"29:35.9","1:57.0",30,116,"FixedDistanceInterval"],
["2026-08-03",1237,"26:00.0","1:37.0",38,123,"FixedTimeInterval"],
["2026-07-29",3500,"26:04.5","2:00.6",29,115,"VariableInterval"],
["2026-07-27",2222,"35:30.0","1:41.3",37,118,"FixedTimeInterval"],
["2026-07-25",4000,"28:51.3","1:55.2",29,117,"VariableInterval"],
["2026-07-20",1800,"28:09.1","1:42.5",36,125,"VariableInterval"],
["2026-07-17",7500,"44:07.7","2:08.5",27,120,"VariableInterval"],
["2026-07-11",5622,"27:00.0","2:08.1",25,117,"VariableInterval"],
["2026-06-30",900,"13:02.5","1:41.4",39,126,"VariableInterval"]
];
var C2SYNC = null;   /* sync/results.json, refreshed daily at 9am ET by c2sync.yml */
function c2Link(id){ return "https://log.concept2.com/profile/2198296/log/" + id; }
/* The sync files a result under the plan day it belongs to, not the erg's own
   date, so this looks that date up exactly. The old ±1 day tolerance repeated
   work the sync already does — and it searched backwards first, which put
   Wednesday's row on Thursday's card. */
function syncOn(date){
  if(!C2SYNC) return null;
  return C2SYNC[date] || null;
}
function c2On(date){
  var live = syncOn(date);
  if(live) return ["sync", live];
  for(var i=0;i<C2LOG.length;i++){ if(C2LOG[i][0]===date) return ["snap", C2LOG[i]]; }
  return null;
}
/* the comparable is found in the live logbook every time the page loads, so a
   session repeated in week 7 is measured against week 1, not a baked snapshot */
function keyParts(k){
  var m = /^([dt])(\d+)x(\d+)$/.exec(String(k || ""));
  return m ? {u:m[1], size:+m[2], reps:+m[3]} : null;
}
function mmss(sec){
  var m = Math.floor(sec / 60), r = Math.round(sec - m * 60);
  if(r === 60){ m++; r = 0; }
  return m + ":" + (r < 10 ? "0" : "") + r;
}
/* Two sessions are comparable when a single INTERVAL lasts about as long, not
   when the total volume matches. 8 × 750m and 4 × 1500m are both 6000m, but the
   piece is twice as long and trains something else entirely. A distance piece is
   converted to seconds at the middle of that day's own band first, so 750m at
   threshold reads as ~3:13 and can be matched against a 4:00 interval. Rep count
   is deliberately ignored. */
function planIvSecs(s){
  var p = s && keyParts(s.key);
  if(!p) return 0;
  if(p.u === "t") return p.size;
  return (s.lo && s.hi) ? p.size / 500 * secFromPct((s.lo + s.hi) / 2) : 0;
}
function ivSecsOn(dt, key){
  var s = SESSIONS[dt];
  return planIvSecs({key:key, lo:s && s.lo, hi:s && s.hi});
}
/* 0.65 admits roughly 2:05–4:57 against a 3:13 target — her rule of thumb is
   "2, 3 or at most 4 minutes", and 1500m at threshold (6:26) lands at 0.50. */
var SIM_FLOOR = 0.65;
function ivSimilar(a, b){
  if(!a || !b) return 0;
  var r = Math.min(a, b) / Math.max(a, b);
  return r >= SIM_FLOOR ? r : 0;
}
/* Interval length decides. Rep count is worth 15% and only ever breaks a tie:
   10 × 1:30 should find 10 × 1:20 rather than 2 × 400m, which happens to sit
   one second closer in duration but is a different session. */
function ivScore(aKey, aSec, bKey, bSec){
  var r = ivSimilar(aSec, bSec);
  if(!r) return 0;
  var pa = keyParts(aKey), pb = keyParts(bKey);
  var rr = (pa && pb) ? Math.min(pa.reps, pb.reps) / Math.max(pa.reps, pb.reps) : 1;
  return r * (0.85 + 0.15 * rr);
}
function comparableFor(date, s){
  if(!C2SYNC || !s || !s.key) return null;
  var want = keyParts(s.key), wantSec = planIvSecs(s);
  if(!want || !wantSec) return null;
  var best = null, bestScore = 0, bestDate = "";
  Object.keys(C2SYNC).forEach(function(dt){
    if(dt.charAt(0) !== "2" || dt >= date) return;
    var w = C2SYNC[dt];
    if(!w || !w.key || !w.pace) return;
    var got = keyParts(w.key);
    if(!got) return;
    /* the logbook knows the pace actually rowed, so use it for the conversion */
    var gotSec = got.u === "t" ? got.size : got.size / 500 * paceSec(w.pace);
    var exact = got.u === want.u && got.size === want.size && got.reps === want.reps;
    var sc = exact ? 2 : ivScore(s.key, wantSec, w.key, gotSec);
    if(!sc) return;
    if(sc > bestScore || (sc === bestScore && dt > bestDate)){
      bestScore = sc; bestDate = dt;
      best = {date:dt, w:w, exact:exact, sec:gotSec, want:wantSec};
    }
  });
  return best;
}
function c2Fields(hit){
  if(hit[0] === "sync"){
    var w = hit[1];
    return { line: w.dist.toLocaleString() + " m work  ·  " + w.time + "  ·  " + w.pace + " /500m  ·  r" + w.rate,
             pace: w.pace, link: w.link || c2Link(w.id) };
  }
  var a = hit[1];
  return { line: a[1].toLocaleString() + " m  ·  " + a[2] + "  ·  " + a[3] + " /500m  ·  r" + a[4] + "  ·  drag " + a[5],
           pace: a[3], link: null };
}
function paceSec(p){ var a=String(p).split(":"); return a.length===2 ? (+a[0])*60 + parseFloat(a[1]) : NaN; }
function c2Summary(w){
  return w[1].toLocaleString() + " m  ·  " + w[2] + "  ·  " + w[3] + " /500m  ·  r" + w[4] + "  ·  drag " + w[5];
}

/* ---------- prescribed sets, reps and effort target ---------- */
var RXMETA = {
  "Unbroken hang challenge":{sets:1,reps:"",rir:"one round, unbroken",rest:"as needed",tier:2},
  "Box jump, step down":{sets:4,reps:3,rir:"max intent",rest:"2:00",tier:2},
  "Heavy top single":{sets:1,reps:1,rir:"RPE 7",rest:"4:00–5:00",tier:1},
  "Back squat":{sets:4,reps:5,rir:"RIR 2-3",rest:"3:00",tier:1},
  "Pin squat, dead stop":{sets:3,reps:3,rir:"RIR 3",rest:"2:30",tier:1},
  "Leg press or hack squat":{sets:3,reps:10,rir:"RIR 2",rest:"2:00",tier:3},
  "Leg extension":{sets:3,reps:12,rir:"RIR 1-2",rest:"1:00",tier:3},
  "Cable abduction":{sets:3,reps:15,rir:"RIR 1",rest:"0:45",tier:3},
  "Rotary torso":{sets:3,reps:12,rir:"RIR 2 · 3s ecc",rest:"1:00",tier:3},
  "Pallof press":{sets:3,reps:10,rir:"control",rest:"0:45",tier:3},
  "Trap bar deadlift":{sets:4,reps:5,rir:"RPE cap 7",rest:"3:00",tier:1},
  "Weighted pull-up":{sets:4,reps:5,rir:"RIR 2",rest:"2:30",tier:1},
  "Chest-supported row":{sets:3,reps:9,rir:"RIR 2",rest:"1:30",tier:3},
  "Hip thrust":{sets:3,reps:10,rir:"RIR 2",rest:"1:30",tier:3},
  "Lat pulldown, neutral grip":{sets:3,reps:11,rir:"RIR 1-2",rest:"1:15",tier:3},
  "Cable lateral · rear delt":{sets:3,reps:15,rir:"RIR 0-1",rest:"0:45",tier:3},
  "Ab wheel · rotary torso":{sets:3,reps:8,rir:"RIR 2",rest:"1:00",tier:3},
  "Suitcase carry":{sets:3,reps:"40m",rir:"heavy, no lean",rest:"1:30",tier:3},
  "7-stroke peak power test":{sets:3,reps:7,rir:"max",rest:"3:00–5:00",tier:2},
  "Plyo push-up":{sets:4,reps:4,rir:"max intent",rest:"1:30",tier:2},
  "Heavy bench single":{sets:1,reps:1,rir:"RPE 7",rest:"4:00",tier:1},
  "Bench":{sets:4,reps:6,rir:"RIR 2",rest:"2:30",tier:1},
  "Transformer bar squat":{sets:3,reps:5,rir:"RPE ≤7",rest:"2:00",tier:1},
  "DB shoulder press":{sets:3,reps:9,rir:"RIR 2",rest:"1:30",tier:3},
  "Ring row, feet elevated":{sets:3,reps:9,rir:"RIR 2",rest:"1:30",tier:3},
  "Incline DB press":{sets:3,reps:11,rir:"RIR 1-2",rest:"1:30",tier:3},
  "Lateral raise · EZ curl · OH extension":{sets:4,reps:15,rir:"RIR 0-1",rest:"0:45",tier:3},
  "Sandbag bear hug hold":{sets:3,reps:"30s",rir:"brace",rest:"1:00",tier:3},
  "L-sit on parallettes":{sets:3,reps:"max",rir:"to failure",rest:"1:00",tier:3}
};
function meta(n){ return RXMETA[n] || {sets:3,reps:"",rir:"RIR 2",rest:"1:30",tier:3}; }
/* weeks 2-13 come from block-plan.json, whose exercises carry their own tier and
   whose set/rep counts read off the prescription text rather than RXMETA */
function metaFor(x){
  if(RXMETA[x.n]) return RXMETA[x.n];
  var m = /^(\d+)\s*\u00d7\s*(\d+)/.exec(x.rx || "");
  return {sets: m ? +m[1] : (x.star ? 1 : 3), reps: m ? +m[2] : (x.star ? 1 : ""),
          rir: x.star ? "top set" : "RIR 2", rest: x.star ? "4:00" : "2:00",
          tier: x.tier != null ? x.tier : 3};
}

/* ---------- double progression, read back out of recomp-log ----------
   Hit every prescribed rep at RIR 2 or easier and the load steps up: +5 lb
   upper, +10 lb lower. Reps there but heavy, or reps missed, and it holds.
   Whatever you actually lifted becomes the base, so beating the sheet once
   carries forward for the rest of the block. Tier 3 accessories stay put. */
var UPPER_LIFTS = {"Bench":1,"Heavy bench single":1,"OHP":1,"DB shoulder press":1,
  "Weighted pull-up":1,"Incline DB press":1,"Chest-supported row":1,
  "Lat pulldown, neutral grip":1,"Ring row, feet elevated":1};
function stepFor(n){ return UPPER_LIFTS[n] ? 5 : 10; }
function firstNum(v){ var m = /(\d+(?:\.\d+)?)/.exec(String(v == null ? "" : v)); return m ? parseFloat(m[1]) : 0; }
function rirNum(v){ var m = /(-?\d+)/.exec(String(v || "")); return m ? parseInt(m[1],10) : null; }
function lastEffort(name, before){
  var got = [];
  for(var i=0;i<SHEET_ROWS.length;i++){
    var r = SHEET_ROWS[i];
    /* a box jump has a height and no load; a machine set may be reps only.
       Anything with a number in it is a set worth comparing against. */
    if(r.exercise === name && r.date && r.date < before &&
       (r.weight > 0 || r.height > 0 || r.reps > 0)) got.push(r);
  }
  if(!got.length) return null;
  var last = got[0].date;
  got.forEach(function(r){ if(r.date > last) last = r.date; });
  var sets = got.filter(function(r){ return r.date === last; })
                .sort(function(a,b){ return (a.set_num||0) - (b.set_num||0); });
  return {date:last, sets:sets};
}
/* She works down as often as up - a first set too heavy, then two at the load
   that was right. Double progression should read the load she settled on, so
   take the most frequent weight and break ties on the last set. */
function workingLoad(sets){
  var n = {}, best = 0, bestN = 0;
  sets.forEach(function(z){ if(z.weight > 0) n[z.weight] = (n[z.weight] || 0) + 1; });
  for(var k = sets.length - 1; k >= 0; k--){
    var w = sets[k].weight;
    if(w > 0 && n[w] > bestN){ bestN = n[w]; best = w; }
  }
  return best;
}
function progress(name, prescribed, before){
  var m = meta(name);
  var le = lastEffort(name, before);
  /* if the slot was swapped last time, the rows are under the substitute's
     name - follow the swap so the card still has something to show */
  var alias = "";
  if(!le){
    var ps = priorSub(name, before);
    if(ps){ alias = ps.name; le = lastEffort(ps.name, before); }
  }
  if(!le) return null;
  var top = typeof m.reps === "number" ? m.reps : null;
  var heaviest = workingLoad(le.sets), tallest = 0, allHit = !!top, easy = true, rirTxt = "";
  le.sets.forEach(function(z){
    if(z.height > tallest) tallest = z.height;
    if(top && z.reps < top) allHit = false;
    var rv = rirNum(z.rir);
    if(rv !== null && rv < 2) easy = false;
    if(!rirTxt && z.rir) rirTxt = z.rir;
  });
  var line = le.sets.map(function(z){
    var t = z.weight > 0 ? z.weight + " \u00d7 " + z.reps : z.reps + " reps";
    if(z.height > 0) t += " @ " + z.height + "\u2033";
    return t;
  }).join("   ") + (rirTxt ? "   \u00b7   " + rirTxt : "");
  var base = Math.max(heaviest, prescribed || 0), next = base, verdict;

  /* nothing was loaded - a jump, a carry, a hold. Report the number that
     actually moves rather than inventing a weight to add. */
  if(!base){
    return {date:le.date, alias:alias, line:line, next:null,
      verdict: tallest ? "Best " + tallest + "\u2033 \u2014 beat it"
                       : "Match it, or add a rep"};
  }
  /* tier 3 is volume, not progression - show what she did and leave it there */
  if(m.tier === 3){
    return {date:le.date, alias:alias, line:line, next:heaviest || null,
      verdict: "Accessory \u00b7 match " + heaviest + " lb or add a rep"};
  }
  if(allHit && easy){
    next = base + stepFor(name);
    verdict = "Prescribed " + prescribed + " lb \u2192 try " + next + " lb  \u00b7  every set at " + top + " reps, " + (rirTxt || "RIR 2+");
  } else if(allHit){

/* ---------- readiness ---------- */
function readiness(d){
  var lg = logFor(d);
  var vals = lg.cmj.map(Number).filter(function(v){return v>0;});
  if(!vals.length || !state.baseline.cmj) return null;
  var best = Math.max.apply(null, vals);
  var pct = (best - state.baseline.cmj) / state.baseline.cmj * 100;
  var lvl = pct >= -5 ? "g" : (pct >= -10 ? "a" : "r");
  return {best:best, pct:pct, lvl:lvl};
}

/* A session note is its own row in recomp-log: day_type "erg-note", with the

/* Coach notes are written by hand into coach-notes.json, keyed by the date of
   the session they review. A note carries that session's shape key, so it comes

var COACH = null;
function coachFor(date, s){
  if(!COACH) return null;
  if(COACH[date]) return {date:date, n:COACH[date], mode:"today"};
  if(!s) return null;
  var key = s.key, title = s.title || "", wantSec = planIvSecs(s);
  var best = null, bestScore = 0;
  Object.keys(COACH).forEach(function(dt){
    if(dt >= date) return;
    var n = COACH[dt], sc;
    if(key && n.key === key) sc = 3;
    /* a lift day has no shape key - Strength A/B/C recur by name instead */
    else if(title && n.title && n.title === title) sc = 2;
    else sc = ivScore(key, wantSec, n.key, ivSecsOn(dt, n.key));
    if(!sc) return;
    if(sc > bestScore || (sc === bestScore && best && dt > best.date)){
      bestScore = sc; best = {date:dt, n:n, mode:"prior"};

   Without this they only lived in memory, so a reload threw them away. */
function metricCol(unit){ return unit === "W" ? "watts" : "weight"; }

/* One builder per metric, so a day that carries both a broad jump and a peak
   test renders both. Before this, `broad || peak7` collapsed to one block and
   the jump vanished on peak days. */
function metricBlock(d, lg, m){
  var col = metricCol(m.unit);
  var mb = el("div","ex");
  mb.appendChild(el("div","eyebrow", m.label));
  var ml = el("div","logline");
  var mi = document.createElement("input");
  /* text + decimal inputmode, same reason as the CMJ inputs: a number input
     eats a half-typed decimal point */
  mi.type = "text"; mi.setAttribute("inputmode","decimal");
  mi.autocomplete = "off";
  mi.placeholder = m.ph;
  if((lg.entries[m.key] == null || lg.entries[m.key] === "") && m.seed != null){
    lg.entries[m.key] = String(m.seed);
  }
  mi.value = lg.entries[m.key] || "";
  mi.setAttribute("aria-label", m.aria);
  ml.appendChild(mi);

  var mbtn = document.createElement("button");
  mbtn.type = "button"; mbtn.className = "logbtn";
  var mdone = loggedCount(d, m.name);
  mbtn.textContent = mdone ? "Log again" : m.btn;
  mbtn.disabled = String(mi.value).trim() === "";
  mbtn.addEventListener("click", function(){ logMetric(d, lg, m.key, m.name, m.unit); });
  ml.appendChild(mbtn);
  if(mdone) ml.appendChild(el("span","status",
    mdone + " already in the sheet today"));

  mi.addEventListener("input", function(){
    lg.entries[m.key] = mi.value; queueSave();
    mbtn.disabled = String(mi.value).trim() === "";
  });
  mb.appendChild(ml);
  if(col === "watts" && !SHEET_HAS.watts) mb.appendChild(el("div","subprev",
    "Watts get their own column rather than the load column. If recomp-log " +
    "has no \u201cwatts\u201d header yet, the row will say so."));

  var mprev = lastMetric(d, m.name, col);
  if(mprev) mb.appendChild(el("div","subprev",
    "Last time \u00b7 " + fmtDay(mprev.date) + " \u2014 " + mprev.val + " " + m.unit));
  return mb;
}
function logMetric(d, lg, key, name, unit){
  var v = String(lg.entries[key] == null ? "" : lg.entries[key]).trim();
  if(v === "") return;
  var col = metricCol(unit);
  var prev = lastMetric(d, name, col), note = "";
  if(prev && prev.val){
    var dv = parseFloat(v) - prev.val;
    note = (dv >= 0 ? "+" : "\u2212") + Math.abs(dv).toFixed(1) + " " + unit +
           " vs " + prev.date + " (" + prev.val + " " + unit + ")";
  }
  var row = { date:d, day_type:DAYTYPE[d] || "", exercise:name,
              prescribed:name + " (" + unit + ") \u00b7 weekly",
              set_num:1, reps:1, weight:"", watts:"", rir_rpe:"", notes:note };
  row[col] = v;
  pushRow(row);
  var mirror = {date:d, exercise:name, set_num:1, reps:1,
                weight:0, watts:0, rir:""};
  mirror[col] = parseFloat(v) || 0;
  SHEET_ROWS.push(mirror);
  /* recomp-log grew its `height` column the first time a row carried one, so
     watts may well create itself the same way. Try the write, then look - do
     not refuse up front and leave her unable to log a test she just did. */
  if(col === "watts" && !SHEET_HAS.watts){
    setTimeout(function(){
      jsonp({}, function(rows){
        var head = (rows && rows[0]) || [];
        if(head.indexOf("watts") < 0){
          setStatus("Row written, but recomp-log has no watts column, so the number " +
                    "did not land. Add a header cell called watts, then log it again.");
        } else {
          SHEET_HAS.watts = true;
          loadSheet();
        }
      }, function(){});
    }, 1800);
  }
  renderSession();
}
function lastMetric(before, name, col){
  col = col || "weight";
  var best = null;
  for(var i = 0; i < SHEET_ROWS.length; i++){
    var r = SHEET_ROWS[i];
    if(r.exercise !== name || r.date >= before || !r[col]) continue;
    if(!best || r.date > best.date) best = {date:r.date, val:r[col]};
  }
  return best;
}

function renderSession(){
  var host = document.getElementById("sessionPanel");
  host.textContent = "";
  var d = DATES[state.sel], s = SESSIONS[d], lg = logFor(d);
  var pub = !!s;
  if(!pub) s = {kind:"none", title:"Not published yet", chip:null};

  /* Only a rowing day is completed by a row. A lift day is completed by logging
     its sets, and a row logged on a lift date belongs to the erg day beside it. */
  var c2 = s.kind === "erg" ? c2On(d) : null;
  if(c2 && !lg.done){ lg.done = true; queueSave(); }

  var h = el("div","sess-h");
  var top = el("div","between");
  var left = el("div","stack-s");
  left.appendChild(el("div","d", WEEK[state.sel] + " · " + d));
  left.appendChild(el("div","t", s.title));
  top.appendChild(left);
  if(c2) top.appendChild(el("span","chip done","Complete"));
  else if(s.chip) top.appendChild(el("span","chip " + s.chip, s.chip === "erg" ? "Rowfit · locked" : "Strength"));
  h.appendChild(top);
  host.appendChild(h);

  if(c2){
    var f = c2Fields(c2);
    var done = el("div","c2box");
    done.appendChild(el("span","c2k","Logged to Concept2 — marked complete automatically"));
    done.appendChild(el("span","c2v", f.line));
    if(f.pace && s.kind === "erg" && s.lo){
      var tb = band(s.lo, s.hi), ps = paceSec(f.pace);
      var fast = paceSec(tb.paceLo), slow = paceSec(tb.paceHi);
      if(ps >= fast && ps <= slow) done.appendChild(el("span","c2d","Inside the " + tb.paceLo + " \u2013 " + tb.paceHi + " target."));
      else if(ps < fast) done.appendChild(el("span","c2d",(fast - ps).toFixed(1) + " s/500m faster than the " + tb.paceLo + " \u2013 " + tb.paceHi + " target."));
      else done.appendChild(el("span","c2d",(ps - slow).toFixed(1) + " s/500m slower than the " + tb.paceLo + " \u2013 " + tb.paceHi + " target."));
    }
    if(s.prev && f.pace){
      var dlt = paceSec(s.prev.pace) - paceSec(f.pace);
      done.appendChild(el("span","c2d", Math.abs(dlt).toFixed(1) + " s/500m " +
        (dlt > 0 ? "faster" : "slower") + " than " + s.prev.shape + " on " + s.prev.date + " (" + s.prev.pace + ")"));
    }
    var lr = el("div","c2links");
    if(f.link) lr.appendChild(extLink(f.link, "View on Concept2 →"));
    lr.appendChild(extLink("analysis.html#" + d, "View analysis →"));
    done.appendChild(lr);
    host.appendChild(done);
  }

  /* readiness gate */
  var rd = null;
  if(s.gate){
    var g = el("div","gate");
    g.appendChild(el("div","eyebrow","CMJ — vertical height (in) · 3 jumps, 30s apart"));
    var line = el("div","logline"); line.style.marginTop = "7px";
    [0,1,2].forEach(function(j){
      var inp = document.createElement("input");
      /* text + decimal inputmode rather than type=number: a half-typed "21."
         reads back as "" from a number input, which ate the decimal point */
      inp.type = "text"; inp.setAttribute("inputmode","decimal");
      inp.autocomplete = "off"; inp.placeholder = "jump " + (j+1);
      inp.value = lg.cmj[j] || "";
      inp.setAttribute("aria-label","CMJ vertical jump height " + (j+1) + " (inches)");
      inp.addEventListener("input", function(){ lg.cmj[j] = inp.value; queueSave(); syncGate(); });
      line.appendChild(inp);
    });
    var bl = document.createElement("input");
    bl.type = "text"; bl.setAttribute("inputmode","decimal");
    bl.autocomplete = "off"; bl.placeholder = "baseline in";
    bl.value = state.baseline.cmj || "";
    bl.setAttribute("aria-label","CMJ vertical jump height baseline (inches)");
    bl.addEventListener("input", function(){
      state.baseline.cmj = Number(bl.value) || 0; queueSave(); syncGate();
    });
    line.appendChild(el("span","status","baseline →"));
    line.appendChild(bl);
    g.appendChild(line);

    var lb = el("div","logline"); lb.style.marginTop = "7px";
    var cbtn = document.createElement("button");
    cbtn.type = "button"; cbtn.className = "logbtn";
    var already = loggedCount(d, "CMJ");
    cbtn.textContent = already ? "Log CMJ again" : "Log CMJ";
    cbtn.disabled = !lg.cmj.some(function(v){ return String(v == null ? "" : v).trim() !== ""; });
    cbtn.addEventListener("click", function(){ logCMJ(d, lg); });
    lb.appendChild(cbtn);
    if(already) lb.appendChild(el("span","status",
      already + " jump" + (already > 1 ? "s" : "") + " already in the sheet today"));
    g.appendChild(lb);

    /* The verdict repaints in place as she types. Calling renderSession() from
       the input handler rebuilt these very inputs mid-keystroke, so focus died
       and the phone keyboard closed after every digit. */
    var vbox = el("div");
    g.appendChild(vbox);
    function syncGate(){
      var r = readiness(d);
      cbtn.disabled = !lg.cmj.some(function(v){ return String(v == null ? "" : v).trim() !== ""; });
      while(vbox.firstChild) vbox.removeChild(vbox.firstChild);
      if(r){
        var v = el("div","verdict " + r.lvl);
        var txt = {g:"Run the session as written",
                   a:"Drop the last set of the main lift \u2014 keep everything else",
                   r:"Skip the top set. Technical work at 70%, keep the accessories."}[r.lvl];
        v.appendChild(el("div","vt", txt));
        v.appendChild(el("div","vd", "Best " + r.best + "\u2033 vs baseline " + state.baseline.cmj + "\u2033" +
          " \u2014 " + (r.pct>=0?"+":"") + r.pct.toFixed(1) + "%"));
        if(r.lvl === "r") v.appendChild(el("div","vd","The heavy single is off. A heavy single on a bad day is all cost and no adaptation."));
        if(r.lvl === "a") v.appendChild(el("div","vd","The heavy single stays \u2014 it's the last set of the main lift that goes."));
        vbox.appendChild(v);
      } else {
        vbox.appendChild(el("p","note","Vertical only \u2014 touch height minus your standing reach. Enter three jumps and a baseline to arm the gate."));
      }
    }
    rd = readiness(d);
    var lvlAtRender = rd ? rd.lvl : null;
    syncGate();

    /* the gate also cuts sets further down, so repaint the whole session once
       she leaves the gate entirely \u2014 and only if the verdict actually moved */
    g.addEventListener("focusout", function(e){
      if(g.contains(e.relatedTarget)) return;
      var now = readiness(d);
      if((now ? now.lvl : null) !== lvlAtRender) renderSession();
    });

    host.appendChild(g);
  }

  /* The broad jump primes the nervous system, so it belongs before the work -
     and on a peak-test Saturday it is the warm-up for the test itself. */
  if(s.broad) host.appendChild(metricBlock(d, lg, {
    key:"broad", name:"Broad jump", unit:"cm",
    label: s.peak7 ? "Broad jump \u2014 primer for the peak test \u00b7 distance (cm)"
                   : "Broad jump \u2014 distance (cm) \u00b7 weekly",
    ph:"cm", aria:"Broad jump distance (centimetres)",
    seed:s.broadVal, btn:"Log broad jump"
  }));

  if(s.note){
    var nb = el("div"); nb.style.padding = "13px"; nb.style.borderBottom = "1px solid var(--rule)";
    nb.appendChild(el("p","note w", s.note));
    host.appendChild(nb);
  }

  if(!pub){
    var np = el("div","nopub");
    np.appendChild(el("p","note","Week " + state.week + " hasn't been written yet. Anything you row on this date still appears above once it reaches your Concept2 logbook."));
    host.appendChild(np);
  }

  if(s.kind === "erg"){
    var b = el("div"); b.style.padding = "13px";
    b.appendChild(el("pre","erg-txt", s.raw));
    var bd = band(s.lo, s.hi);
    var pbx = el("div","paceband");
    function pcell(k,v,sub){ var c = el("div","pb"); c.appendChild(el("span","k",k));
      c.appendChild(el("span","v",v)); if(sub) c.appendChild(el("span","s",sub)); return c; }
    pbx.appendChild(pcell("Target pace /500m", bd.paceLo + " – " + bd.paceHi,
      "Rowcalc " + (state.conv === "power" ? "Power" : "Pace") + " mode"));
    pbx.appendChild(pcell("Target watts", bd.wLo + " – " + bd.wHi + " W",
      "PB " + fmtTime(state.pb) + " = " + Math.round(basePower()) + " W"));
    pbx.appendChild(pcell("Rate", s.rate, ""));
    b.appendChild(pbx);
    var cmp = comparableFor(d, s);
    if((cmp || s.prev) && !c2On(d)){
      var pb2 = el("div","prevbox");
      var pDate, pShape, pPace, pRate, pWhy, pLink, pRaw;
      if(cmp){
        pDate = fmtDay(cmp.date); pShape = cmp.w.shape || (cmp.w.dist + " m");
        pPace = cmp.w.pace; pRate = cmp.w.rate;
        pWhy = cmp.exact ? "same shape, straight from your logbook"
          : "closest interval length \u2014 " + mmss(cmp.sec) + " of work vs " +
            mmss(cmp.want) + " today";
        pLink = cmp.w.link || c2Link(cmp.w.id); pRaw = cmp.date;
      } else {
        pDate = s.prev.date; pShape = s.prev.shape; pPace = s.prev.pace;
        pRate = s.prev.rate; pWhy = s.prev.why; pLink = c2Link(s.prev.id);
        pRaw = s.prev.date;
      }
      pb2.appendChild(el("span","c2k","Last comparable attempt · " + pDate));
      pb2.appendChild(el("span","c2v", pShape));
      pb2.appendChild(el("span","c2d", pPace + " /500m  ·  r" + pRate + "  ·  " + pWhy));
      var lr2 = el("div","c2links");
      lr2.appendChild(extLink(pLink, "View on Concept2 →"));
      if(pRaw) lr2.appendChild(extLink("analysis.html#" + pRaw, "View analysis →"));
      pb2.appendChild(lr2);
      b.appendChild(pb2);
    }
    var pn = priorNote(d, s.key);
    if(pn){
      var pnb = el("div","prevbox notebox");
      pnb.appendChild(el("span","c2k","Your note \u00b7 " + fmtDay(pn.date) +
        (pn.exact ? "" : "  \u00b7  nearest shape")));
      pnb.appendChild(el("span","c2v", pn.text));
      b.appendChild(pnb);
    }
    var nw = el("div","notewrap");
    nw.appendChild(el("span","c2k","How did it feel?"));
    var ta = document.createElement("textarea");
    ta.className = "noteta";
    ta.rows = 2;
    ta.placeholder = "Difficulty, pacing, what you'd change \u2014 whatever you'd want to read the next time this one comes round.";
    ta.value = noteOn(d);
    nw.appendChild(ta);
    var nbtn = el("button","notebtn","Save note");
    nbtn.addEventListener("click", function(){ logErgNote(d, s, ta.value); });
    nw.appendChild(nbtn);
    b.appendChild(nw);
    if(s.ezId){
      var lk = document.createElement("a");
      lk.className = "ezlink"; lk.target = "_blank"; lk.rel = "noopener";
      lk.href = s.ezUrl || ("https://admin.erg.zone/workouts/" + s.ezId + "/details");
      lk.textContent = "Open in ErgZone →";
      b.appendChild(lk);
    }
    b.style.display = "flex"; b.style.flexDirection = "column"; b.style.gap = "11px";
    host.appendChild(b);
  }

  if(s.kind === "lift"){
    var showAll = !!state.showAll;
    var hidden = 0;
    s.ex.forEach(function(x, i){
      if(!showAll && metaFor(x).tier === 3){ hidden++; return; }
      var row = el("div","ex" + (x.star ? " star" : ""));
      var cut = false;
      if(rd){
        if(rd.lvl === "r" && (x.star || x.tier === 1 && !x.test)) cut = x.star;
        if(rd.lvl === "r" && x.star) cut = true;
      }
      if(cut) row.classList.add("cut");
      var top2 = el("div","ex-top");
      top2.appendChild(el("span","slot", x.s));
      var m = el("div","ex-main");
      m.appendChild(el("span","exname", x.n));
      var curSub = subFor(d, x);
      if(curSub) m.appendChild(el("span","exsub", "→ " + curSub));
      if(x.load) m.appendChild(el("span","exload", x.load() + " lb"));
      m.appendChild(el("span","exrx", x.rx));
      var mm = metaFor(x);
      m.appendChild(el("span","exrir", mm.rir + "  ·  rest " + mm.rest));
      if(cut) m.appendChild(el("span","cutflag","Cut by the readiness gate"));
      top2.appendChild(m);

      /* collapse to the title. By hand only — nothing folds itself, so what is
         open stays open while she works down the session. */
      var fkey = d + "|" + x.n;
      var folded = !!state.fold[fkey];
      if(folded) row.classList.add("folded");
      var fb = document.createElement("button");
      fb.className = "foldbtn"; fb.type = "button";
      fb.textContent = folded ? "▸" : "▾";
      fb.title = folded ? "Show details" : "Collapse to title";
      fb.setAttribute("aria-label", (folded ? "Expand " : "Collapse ") + x.n);
      fb.setAttribute("aria-expanded", folded ? "false" : "true");
      fb.addEventListener("click", function(){
        state.fold[fkey] = !state.fold[fkey];
        renderSession();
      });
      top2.appendChild(fb);
      row.appendChild(top2);

      var pg = progress(x.n, firstNum(x.load ? x.load() : 0), d);
      if(pg){
        var pr = el("div","prog");
        pr.appendChild(el("span","pk","Last time \u00b7 " + fmtDay(pg.date) +
          (pg.alias && !subIntent(x.n) ? "  \u00b7  " + pg.alias : "")));
        pr.appendChild(el("span","pv", pg.line));
        pr.appendChild(el("span","pd", pg.verdict));
        row.appendChild(pr);
      }

      var sbi = subIntent(x.n);
      if(sbi){
        var sw = el("div","subline");
        var sel = document.createElement("select");
        sel.className = "subsel";
        sel.setAttribute("aria-label", "Swap " + x.n + " for an alternative");
        var alts = sbi[1].slice();
        if(alts.indexOf(x.n) < 0) alts.unshift(x.n);
        alts.forEach(function(o){
          var op = document.createElement("option");
          op.value = (o === x.n) ? "" : o;
          op.textContent = (o === x.n) ? "As written — " + o : o;
          if(op.value === curSub) op.selected = true;
          sel.appendChild(op);
        });
        sel.addEventListener("change", function(){
          if(sel.value) state.sub[d + "|" + x.n] = sel.value;
          else delete state.sub[d + "|" + x.n];
          renderSession();
        });
        sw.appendChild(sel);
        sw.appendChild(el("span","subint", sbi[0]));
        row.appendChild(sw);
        var ps = priorSub(x.n, d);
        if(ps) row.appendChild(el("div","subprev",
          "Last time · " + fmtDay(ps.date) + " — you did " + ps.name + " instead"));
      }

      var key = "e" + i;
      var m = metaFor(x);
      var done = loggedCount(d, effName(d, x));
      var bar = el("div","logline");
      var add = document.createElement("button");
      add.className = "addbtn"; add.type = "button"; add.textContent = "+";
      add.setAttribute("aria-label","Log a set of " + effName(d, x));
      add.addEventListener("click", function(){ openLog(d, x, m, done + 1); });
      bar.appendChild(add);
      bar.appendChild(el("span","logged", done
        ? done + " of " + m.sets + " logged"
        : "log " + m.sets + " set" + (m.sets>1?"s":"")));
      row.appendChild(bar);
      host.appendChild(row);
    });
    if(hidden || state.showAll){
      var tg = el("div","ex");
      var tb = document.createElement("button");
      tb.className = "addset"; tb.type = "button";
      tb.textContent = state.showAll ? "− hide accessories" : "+ " + hidden + " accessories (tier 3, held)";
      tb.addEventListener("click", function(){ state.showAll = !state.showAll; renderSession(); });
      tg.appendChild(tb);
      host.appendChild(tg);
    }
  }

  /* The peak number is logged after the test, so its field sits at the foot
     of the card rather than up with the warm-up. */
  if(s.peak7) host.appendChild(metricBlock(d, lg, {
    key:"peak7", name:"7-stroke peak", unit:"W",
    label:"7-stroke peak (watts)", ph:"peak W", aria:"Peak watts",
    seed:s.peak7Val, btn:"Log peak"
  }));

  /* The note reads the session, so it sits under it - and it is commentary,
     not prescription, so it is styled as its own object rather than one more
     row in the list. */
  var cn = coachFor(d, s);
  if(cn) host.appendChild(coachCard(cn));

  /* done */
  var f = el("div"); f.style.padding = "13px";
  var cb = el("label","cbx");
  var c = document.createElement("input"); c.type = "checkbox"; c.checked = !!lg.done;
  c.addEventListener("change", function(){ lg.done = c.checked; queueSave(); renderDays(); });
  cb.appendChild(c); cb.appendChild(el("span",null,"Session complete"));
  f.appendChild(cb);
  host.appendChild(f);
}

  document.getElementById("wEyebrow").textContent =
    "Week " + state.week + " of " + BLOCK_N +
    (state.week === aw ? "  \u00b7  this week" : state.week < aw ? "  \u00b7  already run" : "  \u00b7  ahead");
  document.getElementById("wPrev").disabled = state.week <= 1;
  document.getElementById("wNext").disabled = state.week >= BLOCK_N;
  document.getElementById("wNow").disabled = state.week === aw;
}

function weekResults(n){
  var ds = datesFor(n), rows = 0, done = 0, paces = [], lifts = 0;
  ds.forEach(function(d){
    var s = SESSIONS[d];
    if(s && s.kind === "erg"){
      rows++;
      var hit = c2On(d);
      if(hit){ done++; paces.push(c2Fields(hit).pace); }
    }
    if(s && s.kind === "lift"){
      for(var i=0;i<SHEET_ROWS.length;i++){ if(SHEET_ROWS[i].date === d){ lifts++; break; } }
    }
  });
  return {rows:rows, done:done, paces:paces, lifts:lifts};
}

function renderArchive(){
  var panel = document.getElementById("archivePanel");
  var body = document.getElementById("archiveBody");
  var aw = activeWeek(), any = false;
  body.textContent = "";
  for(var n=1;n<aw;n++){
    if(!weekHasPlan(n)) continue;
    any = true;
    var r = weekResults(n);
    var row = el("div","arow");
    var l = el("div","al");
    l.appendChild(el("span","aw","Week " + n + "  \u00b7  " + weekLabel(n)));
    var bits = [r.done + " of " + r.rows + " rows logged"];
    if(r.paces.length) bits.push(r.paces.join("  /  "));
    if(r.lifts) bits.push(r.lifts + " lift day" + (r.lifts > 1 ? "s" : "") + " logged");
    l.appendChild(el("span","as", bits.join("  \u00b7  ")));
    row.appendChild(l);
    var go = document.createElement("button");
    go.type = "button"; go.textContent = "Open";
    (function(k){ go.addEventListener("click", function(){ setWeek(k); window.scrollTo({top:0, behavior:"smooth"}); }); })(n);
    row.appendChild(go);
    body.appendChild(row);
  }
  panel.hidden = !any;
}

function render(){ renderWeekNav(); renderDays(); renderSession(); renderArchive(); }

document.getElementById("wPrev").addEventListener("click", function(){ setWeek(state.week - 1); });
document.getElementById("wNext").addEventListener("click", function(){ setWeek(state.week + 1); });
document.getElementById("wNow").addEventListener("click", function(){ setWeek(activeWeek()); });
document.getElementById("wSel").addEventListener("change", function(){ setWeek(Number(this.value)); });

/* ---------- panels ---------- */
document.querySelectorAll("[data-toggle]").forEach(function(btn){
  btn.addEventListener("click", function(){
    var t = document.getElementById(btn.dataset.toggle);
    var open = btn.getAttribute("aria-expanded") === "true";
    btn.setAttribute("aria-expanded", open ? "false" : "true");
    t.hidden = open;
    btn.querySelector(".caret").textContent = open ? "+" : "–";
  });
});
document.getElementById("convSeg").addEventListener("click", function(e){
  var b = e.target.closest("button"); if(!b) return;
  state.conv = b.dataset.c;
  this.querySelectorAll("button").forEach(function(x){
    x.setAttribute("aria-pressed", x.dataset.c === state.conv ? "true" : "false");
  });
  queueSave(); renderSession();
});

/* ---------- persistence: the sheet is the store ---------- */
var ENDPOINT = "https://script.google.com/macros/s/AKfycbyq0ZEWv8ZfkL8XhESm5gU7APsIVvm86VRGt8HFbTVepVQJEixQ4Lk_P9GGdEvodsw/exec";
var SHEET_ROWS = [];
/* which columns recomp-log actually carries - watts arrived later than the
   rest, so the peak-power control checks for it rather than writing a number
   into a column that means something else */
var SHEET_HAS = {watts:false};
function jsonp(params, cb, onErr){
  var name = "cb_" + Math.random().toString(36).slice(2);
  var t = setTimeout(function(){ cleanup(); if(onErr) onErr("timeout"); }, 15000);
  function cleanup(){
    clearTimeout(t);
    try{ delete window[name]; }catch(e){ window[name] = undefined; }
    if(sc && sc.parentNode) sc.parentNode.removeChild(sc);
  }
  window[name] = function(data){ cleanup(); cb(data); };
  var qs = Object.keys(params).map(function(k){
    return encodeURIComponent(k) + "=" + encodeURIComponent(params[k] == null ? "" : params[k]);
  }).join("&");
  var sc = document.createElement("script");
  sc.src = ENDPOINT + "?" + qs + "&callback=" + name;
  sc.onerror = function(){ cleanup(); if(onErr) onErr("network"); };
  document.head.appendChild(sc);
}
function setStatus(t){ var e = document.getElementById("status"); if(e) e.textContent = t; }
function pushRow(r){
  setStatus("Writing to recomp-log…");
  jsonp({write:1, date:r.date, day_type:r.day_type, exercise:r.exercise,
    prescribed:r.prescribed, set_num:r.set_num, reps:r.reps, weight:r.weight,
    height:r.height || "", watts:r.watts || "",
    rir_rpe:r.rir_rpe, notes:r.notes, source:"block-console"},
    function(res){
      if(res && res.ok === false) setStatus("Sheet rejected the row: " + (res.error || "unknown"));
      else setStatus(sheetStatus());
    },
    function(err){ setStatus("Could not reach the sheet (" + err + "). Nothing was logged."); });
}
function loadSheet(){
  setStatus("Reading recomp-log…");
  jsonp({}, function(rows){
    if(!Array.isArray(rows)){ setStatus("Unexpected response from the sheet."); return; }
    var head = rows[0] || [], ix = {};
    head.forEach(function(h,k){ ix[String(h)] = k; });
    SHEET_HAS.watts = ix.watts !== undefined;
    SHEET_ROWS = rows.slice(1).map(function(r){
      return { date:String(r[ix.date]||"").slice(0,10), exercise:String(r[ix.exercise]||""),
               set_num:Number(r[ix.set_num])||0, reps:Number(r[ix.reps])||0,
               weight:parseFloat(r[ix.weight])||0, rir:String(r[ix.rir_rpe]||""),
               height:parseFloat(r[ix.height])||0, watts:parseFloat(r[ix.watts])||0,
               notes:String(r[ix.notes]||""),
               pres:String(r[ix.prescribed]||""), dtype:String(r[ix.day_type]||"") };
    });
    setStatus(sheetStatus());
    render();
  }, function(err){ setStatus("Could not read the sheet (" + err + ")."); });
}
function loggedCount(date, exercise){
  var n = 0;
  for(var i=0;i<SHEET_ROWS.length;i++){
    if(SHEET_ROWS[i].date === date && SHEET_ROWS[i].exercise === exercise) n++;
  }
  return n;
}
function queueSave(){}
function sheetStatus(){
  return SHEET_ROWS.length + " rows in recomp-log" +
    (C2SYNC ? "  ·  logbook synced daily at 9am" : "  ·  logbook snapshot");
}
/* ---------- the rest of the block ----------
   Weeks 2-13 live in block-plan.json so the plan can be edited without touching
   this page. Percentages stay declarative there and become loads here, against
   whatever the maxes panel currently says. */
function ezFromId(id){
  var hex = String(id).replace(/-/g, ""), s = "";
  for(var i = 0; i < 16; i++) s += String.fromCharCode(parseInt(hex.substr(i*2, 2), 16));
  return "https://app.erg.zone/w/" + btoa(s).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}
function mkLoad(x){
  if(x.load != null) return function(){ return x.load; };
  if(x.pctLo != null) return function(){ return r5(M()[x.base] * x.pctLo) + "\u2013" + r5(M()[x.base] * x.pctHi); };
  if(x.pct != null) return function(){ return r5(M()[x.base] * x.pct); };
  return null;
}
function loadBlockPlan(){
  fetch("block-plan.json", {cache:"no-store"}).then(function(r){
    if(!r.ok) throw new Error(r.status);
    return r.json();
  }).then(function(j){
    Object.keys(j).forEach(function(dt){
      var src = j[dt], s = SESSIONS[dt] || {};
      ["kind","title","chip","raw","rate","lo","hi","key","note","gate","broad","peak7",
       "broadVal","peak7Val"].forEach(function(f){
        if(src[f] !== undefined && s[f] === undefined) s[f] = src[f];
      });
      if(src.wid && !s.ezUrl){ s.ezUrl = ezFromId(src.wid); if(!s.ezId) s.ezId = src.wid; }
      if(src.ex && !s.ex){
        s.ex = src.ex.map(function(x){
          var o = {s:x.s, n:x.n, rx:x.rx, tier:x.tier};
          if(x.star) o.star = true;
          if(x.test) o.test = true;
          var f = mkLoad(x);
          if(f) o.load = f;
          return o;
        });
      }
      SESSIONS[dt] = s;
    });
    render();
  }).catch(function(){ /* week 1 still renders on its own */ });
}

/* Coach notes — hand-written, optional; the console runs fine without the file */
function loadCoachNotes(){
  fetch("coach-notes.json", {cache:"no-store"}).then(function(r){
    if(!r.ok) throw new Error(r.status);
    return r.json();
  }).then(function(j){ COACH = j; render(); }).catch(function(){ COACH = null; });
}

/* Concept2 logbook — refreshed every morning at 9am ET by c2sync.yml */
function loadC2Sync(){
  fetch("sync/results.json", {cache:"no-store"}).then(function(r){
    if(!r.ok) throw new Error(r.status);
    return r.json();
  }).then(function(j){
    C2SYNC = (j && j.results) ? j.results : j;
    render(); setStatus(sheetStatus());
  }).catch(function(){ /* snapshot already renders */ });
}
/* Fresh on every open. The three loaders below used to run once at boot, so a tab
   left open — or the home-screen icon on iOS, which resumes instead of reloading —
   kept showing the day it was opened on. Re-pull whenever the page becomes visible,
   and if the calendar day rolled over while it sat in the background, follow the
   block to the current week and re-mark today. */
var loadedDay = todayISO(), lastRefresh = 0;

/* GitHub Pages serves this file with cache-control: max-age=600 and sets that
   header itself, so the no-cache <meta> tags cannot override it — an open tab
   can be running code ten minutes stale, and the iOS home-screen app can hold
   its copy far longer. That is how a deployed change appears missing.
   The ETag changes whenever the file does, so watch it and offer a reload.
   Offer, not force: state.log lives only in memory, so an automatic reload
   mid-session would throw away whatever has been typed and not yet logged. */
var pageTag = null;
function showUpdateBar(){
  if(document.getElementById("updbar")) return;
  var b = el("div","updbar"); b.id = "updbar";
  b.appendChild(el("span",null,"A newer version of this page is available."));
  var r = document.createElement("button");
  r.type = "button"; r.textContent = "Reload";
  r.addEventListener("click", function(){ location.reload(); });
  b.appendChild(r);
  document.body.appendChild(b);
}
function checkBuild(){
  fetch(location.pathname + "?v=" + Date.now(), {method:"HEAD", cache:"no-store"})
    .then(function(r){
      var tag = r.headers.get("etag") || r.headers.get("last-modified");
      if(!tag) return;
      if(pageTag === null){ pageTag = tag; return; }   /* first look — just record it */
      if(tag !== pageTag) showUpdateBar();
    })
    .catch(function(){ /* offline: keep running what we have */ });
}

function refreshAll(force){
  var dayChanged = todayISO() !== loadedDay;
  /* a quick tab flick shouldn't re-hit the sheet; a new day always should */
  if(!force && !dayChanged && Date.now() - lastRefresh < 30000) return;
  lastRefresh = Date.now();
  if(dayChanged){
    loadedDay = todayISO();
    setWeek(activeWeek());
  }
  loadBlockPlan();
  loadSheet();
  loadC2Sync();
  loadCoachNotes();
  checkBuild();
}

document.addEventListener("visibilitychange", function(){
  if(document.visibilityState === "visible") refreshAll(false);
});
window.addEventListener("pageshow", function(e){
  if(e.persisted) refreshAll(true);   /* back/forward cache restore — always stale */
});

setWeek(activeWeek());
refreshAll(true);
</script>
