<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Erg Analysis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ground:#F1F3F5; --surface:#FFF; --surface-2:#E8ECEF; --surface-3:#DDE3E8;
  --ink:#14171B; --ink-2:#3C444D; --muted:#69727B;
  --rule:#D3DAE0; --rule-strong:#B5BFC8;
  /* pillar identity - tabs and chips only, never a chart series */
  --sprint:#B23D0B; --sprint-soft:#F8E2D7;
  --vo2:#0C6F6B;   --vo2-soft:#DBECEB;
  --thr:#2D5AA8;   --thr-soft:#DEE7F5;
  --test:#9A6510;  --test-soft:#F4E9D5;
  /* chart series - validated categorical trio, fixed order, never cycled */
  --s-power:#008C7E; --s-stroke:#B23D0B; --s-rate:#2D5AA8;
  /* status - reserved, always shipped with a word */
  --up:#1A7A4A; --dn:#8A1C3B;
  --f-d:"Archivo","Helvetica Neue",Arial,sans-serif;
  --f-m:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--f-d);
  font-size:14px;line-height:1.45;-webkit-text-size-adjust:100%;}
.wrap{max-width:960px;margin:0 auto;padding:0 0 60px;}
header{background:var(--surface);border-bottom:1px solid var(--rule);padding:16px 14px 13px;}
h1{margin:0;font-size:19px;font-weight:700;letter-spacing:-0.01em;}
.sub{font-family:var(--f-m);font-size:11.5px;color:var(--muted);margin-top:3px;}
.sub a{color:var(--s-power);text-decoration:none;border-bottom:1px solid var(--rule-strong);}
.tabs{display:flex;gap:1px;background:var(--rule);border-bottom:1px solid var(--rule);
  overflow-x:auto;-webkit-overflow-scrolling:touch;}
.tab{flex:1 0 auto;min-width:88px;background:var(--surface);border:0;cursor:pointer;
  font-family:var(--f-d);font-size:12px;font-weight:600;color:var(--ink-2);
  padding:11px 10px 9px;text-align:center;border-bottom:2px solid transparent;}
.tab .n{display:block;font-family:var(--f-m);font-size:10px;color:var(--muted);font-weight:400;}
.tab[aria-selected=true]{color:var(--ink);border-bottom-color:currentColor;}
.tab[data-p=sprint][aria-selected=true]{color:var(--sprint);}
.tab[data-p=vo2][aria-selected=true]{color:var(--vo2);}
.tab[data-p=threshold][aria-selected=true]{color:var(--thr);}
.tab[data-p=test][aria-selected=true]{color:var(--test);}
section{background:var(--surface);border-bottom:1px solid var(--rule);padding:15px 14px;}
.eyebrow{font-size:10px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;
  color:var(--muted);margin-bottom:10px;}

/* scorecard */
.score{display:grid;grid-template-columns:repeat(auto-fit,minmax(286px,1fr));gap:1px;
  background:var(--rule);border:1px solid var(--rule);}
.card{background:var(--surface);padding:11px 12px 12px;display:flex;flex-direction:column;gap:2px;}
.card .q{font-size:13px;font-weight:700;color:var(--ink);}
.card .k{font-size:9.5px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted);}
.card .v{font-family:var(--f-m);font-size:21px;line-height:1.15;margin-top:4px;
  font-variant-numeric:tabular-nums;}
.card .c{font-family:var(--f-m);font-size:12px;color:var(--ink-2);}
.card .m{font-size:11.5px;line-height:1.4;color:var(--ink-2);margin-top:5px;}
.chip{align-self:flex-start;margin-top:6px;font-size:10px;font-weight:700;letter-spacing:0.07em;
  text-transform:uppercase;padding:2px 7px;border:1px solid currentColor;}
.chip.g{color:var(--up);} .chip.b{color:var(--dn);} .chip.n{color:var(--muted);}
.card.off{opacity:.62;}

/* contribution bar */
.split{margin-top:4px;}
.bars{display:flex;flex-direction:column;gap:6px;}
.brow{display:grid;grid-template-columns:126px 1fr 78px;gap:10px;align-items:center;}
.brow .bl{font-size:11.5px;font-weight:600;color:var(--ink-2);}
.brow .bt{position:relative;height:20px;background:var(--surface-2);}
.brow .bz{position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--rule-strong);}
.brow .bf{position:absolute;top:2px;bottom:2px;min-width:1px;}
.brow .bv{font-family:var(--f-m);font-size:12px;text-align:right;
  font-variant-numeric:tabular-nums;color:var(--ink);}
.barnote{font-family:var(--f-m);font-size:10.5px;color:var(--muted);margin-top:7px;}
@media(max-width:520px){.brow{grid-template-columns:96px 1fr 62px;gap:7px;}}
.lede{font-size:13.5px;line-height:1.55;color:var(--ink);margin:0 0 10px;}
.lede b{font-weight:700;}

/* charts */
.chartbox{position:relative;overflow-x:auto;}
svg{display:block;}
svg text{font-family:var(--f-m);font-size:9px;fill:var(--muted);}
svg text.lab{fill:var(--ink-2);font-size:9.5px;}
svg text.end{font-size:10px;font-weight:500;}
.legend{display:flex;flex-wrap:wrap;gap:13px;margin-top:9px;font-family:var(--f-m);
  font-size:11px;color:var(--ink-2);}
.legend i{display:inline-block;width:14px;height:3px;margin-right:6px;vertical-align:3px;}
.tip{position:absolute;pointer-events:none;opacity:0;transition:opacity .08s;
  background:var(--ink);color:#FFF;font-family:var(--f-m);font-size:11px;line-height:1.5;
  padding:6px 8px;white-space:nowrap;z-index:3;}
.cap{font-size:12.5px;line-height:1.55;color:var(--ink-2);margin:10px 0 0;}
.cap b{color:var(--ink);font-weight:600;}

/* table */
.scroll{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-family:var(--f-m);font-size:11.5px;
  font-variant-numeric:tabular-nums;}
th{text-align:right;font-size:9px;letter-spacing:0.08em;text-transform:uppercase;
  color:var(--muted);font-weight:700;padding:0 6px 6px;border-bottom:1px solid var(--rule);}
th:first-child,td:first-child{text-align:left;}
td{padding:6px;border-bottom:1px solid var(--rule);text-align:right;white-space:nowrap;}
tbody tr{cursor:pointer;}
tbody tr:hover td{background:var(--surface-2);}
tbody tr[aria-selected=true] td{background:var(--surface-3);}
.pill{display:inline-block;font-size:9px;font-weight:700;letter-spacing:0.06em;
  text-transform:uppercase;padding:1px 5px;font-family:var(--f-d);}
.p-sprint{background:var(--sprint-soft);color:var(--sprint);}
.p-vo2{background:var(--vo2-soft);color:var(--vo2);}
.p-threshold{background:var(--thr-soft);color:var(--thr);}
.p-test{background:var(--test-soft);color:var(--test);}

/* readouts */
.reads{display:flex;flex-direction:column;gap:8px;margin-top:12px;}
.rd{display:grid;grid-template-columns:122px 1fr;gap:11px;align-items:baseline;}
.rd .rk{font-size:9.5px;font-weight:700;letter-spacing:0.09em;text-transform:uppercase;color:var(--muted);}
.rd .rv{font-size:12.5px;line-height:1.55;color:var(--ink-2);}
.rd .rv b{color:var(--ink);font-weight:600;}
.rd .rv em{font-style:normal;font-family:var(--f-m);color:var(--ink);}
.caveat{font-family:var(--f-m);font-size:10.5px;line-height:1.5;color:var(--muted);margin:10px 0 0;}
@media(max-width:520px){.rd{grid-template-columns:1fr;gap:2px;}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <h1>Erg Analysis</h1>
  <div class="sub" id="hdr">loading…</div>
</header>

<div class="tabs" id="tabs" role="tablist"></div>

<section>
  <div class="eyebrow" id="scoreHead">Are you getting better?</div>
  <div class="score" id="score"></div>
  <p class="caveat" id="scoreCav"></p>
</section>

<section>
  <div class="eyebrow">Where the power came from</div>
  <p class="lede" id="splitLede"></p>
  <div class="split">
    <div class="bars" id="splitBar"></div>
    <div class="barnote" id="splitKey"></div>
  </div>
  <p class="cap" id="splitCap"></p>
</section>

<section>
  <div class="eyebrow">Power, stroke and rate over the block &middot; % change from your first three sessions</div>
  <div class="chartbox"><svg id="cIdx" width="920" height="230" role="img"
    aria-label="Power, work per stroke and stroke rate, each indexed to the first session"></svg>
    <div class="tip" id="tipIdx"></div></div>
  <div class="legend" id="legIdx"></div>
  <p class="cap" id="capIdx"></p>
</section>

<section>
  <div class="eyebrow">Stroke economy &middot; strokes above or below what that power usually costs you</div>
  <div class="chartbox"><svg id="cEcon" width="920" height="170" role="img"
    aria-label="Stroke rate residual against the rate expected for each session's power"></svg>
    <div class="tip" id="tipEcon"></div></div>
  <p class="cap" id="capEcon"></p>
</section>

<section>
  <div class="eyebrow">Sessions &middot; tap one to open it</div>
  <div class="scroll"><table id="tbl"></table></div>
</section>

<section id="detail">
  <div class="eyebrow" id="detHead">Session</div>
  <p class="lede" id="detLede"></p>
  <div class="chartbox"><svg id="cRep" width="920" height="220" role="img"
    aria-label="Power, work per stroke and stroke rate for each interval, indexed to the first"></svg>
    <div class="tip" id="tipRep"></div></div>
  <div class="legend" id="legRep"></div>
  <p class="cap" id="capRep"></p>
  <div class="scroll"><table id="ivTbl"></table></div>
  <div class="reads" id="detRead"></div>
</section>
</div>
<script>
"use strict";
/* ------------------------------------------------------------------
   What this page can and cannot know.

   The PM5 hands back two independent numbers per interval: pace and
   stroke rate. Everything else is arithmetic on those two -

     watts        = 2.80 / (pace_s_per_m)^3
     work/stroke  = watts * 60 / rate          (J)
     metres/stroke= 30000 / (rate * pace_500)  (m)

   which means "faster" and "more powerful" are the same measurement in
   different units, and the only real question left is HOW the power was
   made: a bigger stroke, or more of them. That identity -

     watts = work-per-stroke * rate / 60

   is exact, so every change in power splits cleanly into a stroke share
   and a rate share. That split is what most of this page shows.

   A force curve is genuinely new information and the logbook does not
   carry it; only ErgZone does. Heart rate is the other genuinely new
   axis and lights up the moment it starts arriving in the sync.
   ------------------------------------------------------------------ */
var PB = 99.9;                       /* 500m PB in seconds */
var VT2 = 167;                       /* PNOE, Apr 2025 - anaerobic threshold */
var SER = {power:"#008C7E", stroke:"#B23D0B", rate:"#2D5AA8"};
var LABEL = {sprint:"Sprint", vo2:"VO₂", threshold:"Threshold", test:"Test"};
var S = {pillar:"all", sel:null, sessions:[], econ:null};

function paceStr(s){
  if(!s) return "—";
  var m = Math.floor(s/60), r = s - m*60;
  return m + ":" + (r < 10 ? "0" : "") + r.toFixed(1);
}
function paceSec(str){
  var m = /(\d+):(\d\d(?:\.\d+)?)/.exec(String(str || ""));
  return m ? (+m[1]) * 60 + parseFloat(m[2]) : 0;
}
function mmssShort(sec){
  var m = Math.floor(sec/60), r = Math.round(sec - m*60);
  if(r === 60){ m++; r = 0; }
  return m + ":" + (r < 10 ? "0" : "") + r;
}
function pct(s){ return s ? (2 - s/PB) * 100 : 0; }
function wattsFor(paceSec){ return paceSec ? 2.80 / Math.pow(paceSec/500, 3) : 0; }
function mPerStroke(p, spm){ return (p && spm) ? 30000/(spm*p) : 0; }
function jPerStroke(w, spm){ return (w && spm) ? w*60/spm : 0; }
function fmtDay(iso){
  var M = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  return M[+iso.slice(5,7)-1] + " " + (+iso.slice(8,10));
}
function el(tag, cls, txt){
  var e = document.createElement(tag);
  if(cls) e.className = cls;
  if(txt != null) e.textContent = txt;
  return e;
}
function svgEl(n, a){
  var e = document.createElementNS("http://www.w3.org/2000/svg", n);
  for(var k in a) if(a[k] != null) e.setAttribute(k, a[k]);
  return e;
}
function mean(a){ return a.length ? a.reduce(function(x,y){return x+y;},0)/a.length : 0; }
function pos(a){ return a.filter(function(v){ return v > 0; }); }
function sgnPct(v, sig){ return v > sig ? 1 : (v < -sig ? -1 : 0); }
function pctStr(v, dp){
  return (v >= 0 ? "+" : "−") + Math.abs(v).toFixed(dp == null ? 1 : dp) + "%";
}

/* ---------- one row per session ---------- */
function build(results, intervals, pillars){
  var out = [];
  Object.keys(intervals).sort().forEach(function(d){
    var rows = intervals[d] || [];
    if(!rows.length) return;
    var r = results[d] || {};
    var dist = 0, time = 0;
    rows.forEach(function(x){ dist += x[0]; time += x[0] * x[1] / 500; });
    var paces = rows.map(function(x){ return x[1]; });
    var spms  = pos(rows.map(function(x){ return x[3]; }));
    var watts = pos(rows.map(function(x){ return x[2]; }));
    var hrs   = pos(rows.map(function(x){ return x[4]; }));
    var avg = dist ? time / dist * 500 : 0;
    var w = watts.length ? mean(watts) : wattsFor(avg);
    var sp = mean(spms);
    out.push({
      date: d, pillar: pillars[d] || "test",
      shape: r.shape || (rows.length + " × " + rows[0][0] + "m"),
      key: r.key || "", link: r.link || "", band: r.band || "", note: r.note || "",
      rows: rows, reps: rows.length, dist: dist,
      pace: avg, pct: pct(avg),
      spm: sp, watts: w,
      jps: jPerStroke(w, sp),
      mps: mPerStroke(avg, sp),
      hrMax: hrs.length ? Math.max.apply(null, hrs) : 0,
      hrAvg: hrs.length ? mean(hrs) : 0,
      spread: Math.max.apply(null, paces) - Math.min.apply(null, paces),
      drift: paces[paces.length-1] - paces[0]
    });
  });
  return out;
}
function inPillar(){
  return S.sessions.filter(function(s){
    return S.pillar === "all" || s.pillar === S.pillar;
  });
}
function repOf(r){
  var w = r[2] || wattsFor(r[1]);
  return {dist:r[0], pace:r[1], watts:w, spm:r[3], hr:r[4] || 0,
          jps:jPerStroke(w, r[3]), mps:mPerStroke(r[1], r[3]),
          secs:r[0]/500*r[1]};
}
function ivSecs(s){ return mean(s.rows.map(function(r){ return r[0]/500*r[1]; })); }

/* ---------- stroke economy ----------
   Rate rises with power in a very tight relationship across the whole log
   (log-log, R² ≈ 0.95). Fitting it once and reading each session's residual
   gives an efficiency number that does not care how hard the session was
   prescribed: negative means you held that power on fewer strokes than that
   power normally costs you. */
function fitEconomy(list){
  var pts = list.filter(function(s){ return s.watts > 0 && s.spm > 0; });
  if(pts.length < 8) return null;
  var xs = pts.map(function(s){ return Math.log(s.watts); });
  var ys = pts.map(function(s){ return Math.log(s.spm); });
  var mx = mean(xs), my = mean(ys), num = 0, den = 0;
  for(var i = 0; i < xs.length; i++){
    num += (xs[i]-mx) * (ys[i]-my);
    den += (xs[i]-mx) * (xs[i]-mx);
  }
  if(!den) return null;
  var b = num/den, a = my - b*mx;
  return {expected: function(w){ return w > 0 ? Math.exp(a + b*Math.log(w)) : 0; }};
}
function econOf(s){
  return S.econ && s.watts > 0 ? s.spm - S.econ.expected(s.watts) : null;
}

/* ---------- the identity: watts = work/stroke × rate / 60 ---------- */
function decompose(a, b){
  if(!a || !b || !a.watts || !b.watts || !a.jps || !b.jps || !a.spm || !b.spm) return null;
  var lw = Math.log(b.watts/a.watts), lj = Math.log(b.jps/a.jps), lr = Math.log(b.spm/a.spm);
  var tot = Math.abs(lj) + Math.abs(lr);
  return {
    power:  (Math.exp(lw)-1)*100,
    stroke: (Math.exp(lj)-1)*100,
    rate:   (Math.exp(lr)-1)*100,
    strokeShare: tot ? Math.abs(lj)/tot : 0.5,
    rateShare:   tot ? Math.abs(lr)/tot : 0.5,
    sameWay: (lj >= 0) === (lr >= 0)
  };
}
/* which side carried the change, and which way it went - the direction
   matters as much as the split: power falling on lower rate is a lighter
   prescription, power falling on a weaker stroke is not */
function carriedBy(d){
  if(!d) return "none";
  if(Math.abs(d.power) < 1.5 && Math.abs(d.stroke) < 1.5 && Math.abs(d.rate) < 1.5) return "flat";
  if(d.stroke > 1 && d.rate < -1) return "traded-up";
  if(d.stroke < -1 && d.rate > 1) return "traded-down";
  var side = d.strokeShare >= 0.62 ? "stroke" : (d.rateShare >= 0.62 ? "rate" : "both");
  if(d.power > 1.5) return "up-" + side;
  if(d.power < -1.5) return "down-" + side;
  return "mixed";
}

/* mean of a group, as something decompose() can take */
function groupMean(list){
  if(!list.length) return null;
  return {watts: mean(pos(list.map(function(s){ return s.watts; }))),
          jps:   mean(pos(list.map(function(s){ return s.jps; }))),
          spm:   mean(pos(list.map(function(s){ return s.spm; }))),
          mps:   mean(pos(list.map(function(s){ return s.mps; }))),
          pace:  mean(pos(list.map(function(s){ return s.pace; })))};
}
function halves(list){
  if(list.length < 4) return null;
  var h = Math.floor(list.length/2);
  return {a: list.slice(0, h), b: list.slice(list.length - h)};
}

/* ---------- charts ----------
   One axis, always. Power, work per stroke and rate live on wildly
   different scales, so they are indexed to a common base (% change from
   the first point) and share a single percentage axis - never two. */
function attachTip(svg, tipEl, xs, xAt, render){
  function hide(){ tipEl.style.opacity = 0; }
  function move(ev){
    var box = svg.getBoundingClientRect();
    var px = (ev.clientX - box.left) / box.width * 920;
    var best = 0, bd = Infinity;
    xs.forEach(function(_, i){
      var d = Math.abs(xAt(i) - px);
      if(d < bd){ bd = d; best = i; }
    });
    var cur = svg.querySelector(".cursor");
    if(cur) cur.setAttribute("transform", "translate(" + (xAt(best) - 460) + ",0)");
    tipEl.innerHTML = "";
    render(best).forEach(function(line, k){
      var d = document.createElement("div");
      d.textContent = line;
      if(k === 0) d.style.fontWeight = "600";
      tipEl.appendChild(d);
    });
    var left = xAt(best) / 920 * box.width;
    tipEl.style.left = Math.min(Math.max(left + 10, 4), box.width - 150) + "px";
    tipEl.style.top = "10px";
    tipEl.style.opacity = 1;
  }
  svg.onmousemove = move;
  svg.onmouseleave = hide;
  svg.ontouchstart = function(e){ if(e.touches[0]) move(e.touches[0]); };
  svg.ontouchmove  = function(e){ if(e.touches[0]) move(e.touches[0]); };
}

/* multi-series, indexed to the first point, one percentage axis */
function indexChart(svg, tipEl, legEl, items, series, opts){
  svg.textContent = ""; legEl.textContent = "";
  var W = 920, H = +svg.getAttribute("height"), L = 46, R = 74, T = 16, B = 30;
  if(items.length < 2){
    svg.appendChild(svgEl("text", {x:L, y:H/2, class:"lab"}))
       .textContent = "Two sessions minimum before a trend exists.";
    return;
  }
  /* baseline is the mean of the first few points, not a single one - one soft
     opening session should not tilt every number on the chart */
  var baseN = Math.min(opts.baseN || 1, items.length - 1) || 1;
  var vals = [];
  series.forEach(function(s){
    var head = items.slice(0, baseN).map(s.of).filter(function(v){ return v > 0; });
    var base = head.length ? mean(head) : s.of(items[0]);
    s.pcts = items.map(function(it){
      var v = s.of(it);
      return (base && v) ? (v/base - 1) * 100 : 0;
    });
    vals = vals.concat(s.pcts);
  });
  var lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals);
  var span = Math.max(hi - lo, 4);
  lo -= span * 0.18; hi += span * 0.18;
  var x = function(i){ return L + i * (W - L - R) / (items.length - 1); };
  var y = function(v){ return H - B - (v - lo) / (hi - lo) * (H - T - B); };

  [lo + (hi-lo)*0.08, (lo+hi)/2, hi - (hi-lo)*0.08].forEach(function(v){
    var yy = y(v);
    svg.appendChild(svgEl("line", {x1:L, x2:W-R, y1:yy, y2:yy, stroke:"#E4E9ED"}));
    var t = svgEl("text", {x:L-7, y:yy+3, "text-anchor":"end"});
    t.textContent = pctStr(v, 0);
    svg.appendChild(t);
  });
  if(lo < 0 && hi > 0){
    svg.appendChild(svgEl("line", {x1:L, x2:W-R, y1:y(0), y2:y(0),
      stroke:"#B5BFC8", "stroke-width":1}));
  }
  /* moving crosshair for the hover layer */
  var cur = svgEl("g", {class:"cursor"});
  cur.appendChild(svgEl("line", {x1:460, x2:460, y1:T, y2:H-B, stroke:"#B5BFC8",
    "stroke-dasharray":"2 3"}));
  svg.appendChild(cur);

  series.forEach(function(s){
    svg.appendChild(svgEl("polyline", {
      points: s.pcts.map(function(v, i){ return x(i) + "," + y(v); }).join(" "),
      fill:"none", stroke:s.color, "stroke-width":2,
      "stroke-linejoin":"round", "stroke-linecap":"round"}));
    s.pcts.forEach(function(v, i){
      svg.appendChild(svgEl("circle", {cx:x(i), cy:y(v), r:4, fill:s.color,
        stroke:"#FFF", "stroke-width":2}));
    });
  });
  /* direct labels at the live end - identity is never colour alone.
     Nudge them apart so two series ending close together stay readable. */
  var ends = series.map(function(s){
    return {s:s, v:s.pcts[s.pcts.length-1], y:y(s.pcts[s.pcts.length-1])};
  }).sort(function(a,b){ return a.y - b.y; });
  for(var k = 1; k < ends.length; k++){
    if(ends[k].y - ends[k-1].y < 12) ends[k].y = ends[k-1].y + 12;
  }
  ends.forEach(function(e){
    var lbl = svgEl("text", {x:W-R+8, y:e.y+3, class:"end", fill:e.s.color});
    lbl.textContent = e.s.short + " " + pctStr(e.v, 0);
    svg.appendChild(lbl);
  });

  var x0 = svgEl("text", {x:L, y:H-9}); x0.textContent = opts.first;
  svg.appendChild(x0);
  var x1 = svgEl("text", {x:W-R, y:H-9, "text-anchor":"end"}); x1.textContent = opts.last;
  svg.appendChild(x1);

  series.forEach(function(s){
    var i = el("span"), w = el("span");
    var sw = el("i"); sw.style.background = s.color;
    w.appendChild(sw); w.appendChild(document.createTextNode(s.name));
    legEl.appendChild(w);
  });

  attachTip(svg, tipEl, items, x, function(i){
    var out = [opts.labelOf(items[i])];
    series.forEach(function(s){
      out.push(s.name + "  " + s.fmt(s.of(items[i])) + "   " + pctStr(s.pcts[i], 1));
    });
    return out;
  });
}

/* single series around a zero line - no legend needed, the title names it */
function zeroChart(svg, tipEl, items, valueOf, opts){
  svg.textContent = "";
  var W = 920, H = +svg.getAttribute("height"), L = 46, R = 20, T = 16, B = 30;
  var pts = items.map(valueOf);
  if(pts.length < 2 || pts.some(function(v){ return v == null; })){
    svg.appendChild(svgEl("text", {x:L, y:H/2, class:"lab"}))
       .textContent = "Not enough sessions to fit the model yet.";
    return;
  }
  var lo = Math.min.apply(null, pts), hi = Math.max.apply(null, pts);
  var m = Math.max(Math.abs(lo), Math.abs(hi), 0.5) * 1.25;
  lo = -m; hi = m;
  var x = function(i){ return L + i * (W - L - R) / (items.length - 1); };
  var y = function(v){ return H - B - (v - lo) / (hi - lo) * (H - T - B); };
  [hi*0.75, 0, lo*0.75].forEach(function(v){
    var yy = y(v);
    svg.appendChild(svgEl("line", {x1:L, x2:W-R, y1:yy, y2:yy,
      stroke: v === 0 ? "#B5BFC8" : "#E4E9ED", "stroke-width": v === 0 ? 1 : 1}));
    var t = svgEl("text", {x:L-7, y:yy+3, "text-anchor":"end"});
    t.textContent = (v > 0 ? "+" : v < 0 ? "−" : "") + Math.abs(v).toFixed(1);
    svg.appendChild(t);
  });
  var cur = svgEl("g", {class:"cursor"});
  cur.appendChild(svgEl("line", {x1:460, x2:460, y1:T, y2:H-B, stroke:"#B5BFC8",
    "stroke-dasharray":"2 3"}));
  svg.appendChild(cur);
  svg.appendChild(svgEl("polyline", {
    points: pts.map(function(v, i){ return x(i) + "," + y(v); }).join(" "),
    fill:"none", stroke:"#14171B", "stroke-width":2, "stroke-linejoin":"round"}));
  pts.forEach(function(v, i){
    svg.appendChild(svgEl("circle", {cx:x(i), cy:y(v), r:4, fill:"#14171B",
      stroke:"#FFF", "stroke-width":2}));
  });
  var a = svgEl("text", {x:L, y:T+4, class:"lab"});
  a.textContent = "↑ more strokes than that power usually costs you";
  svg.appendChild(a);
  var b = svgEl("text", {x:L, y:H-9, class:"lab"});
  b.textContent = "↓ fewer strokes — more economical";
  svg.appendChild(b);
  attachTip(svg, tipEl, items, x, function(i){
    return [opts.labelOf(items[i]),
            "rate " + items[i].spm.toFixed(1) + " vs " +
            S.econ.expected(items[i].watts).toFixed(1) + " expected",
            (pts[i] >= 0 ? "+" : "−") + Math.abs(pts[i]).toFixed(2) + " spm"];
  });
}

function verdict(dir){
  return dir > 0 ? {t:"Improving", c:"g"} : (dir < 0 ? {t:"Slipping", c:"b"} : {t:"Holding", c:"n"});
}
function renderScore(){
  var list = inPillar(), host = document.getElementById("score");
  var cav = document.getElementById("scoreCav");
  host.textContent = ""; cav.textContent = "";
  document.getElementById("scoreHead").textContent =
    "Are you getting better?  ·  " + (S.pillar === "all" ? "all erg work" : LABEL[S.pillar]);
  var hv = halves(list);
  if(!hv){
    host.appendChild(el("div","card")).appendChild(el("div","q",
      "Four sessions in a group before any of this means anything — " + list.length + " so far."));
    return;
  }
  var A = groupMean(hv.a), B = groupMean(hv.b);

  function card(q, k, value, change, sig, better, meaning, off){
    var c = el("div", "card" + (off ? " off" : ""));
    c.appendChild(el("div","q", q));
    c.appendChild(el("div","k", k));
    c.appendChild(el("div","v", value));
    if(change != null){
      c.appendChild(el("div","c", change));
      var v = verdict(sgnPct(sig, 0) * better);
      c.appendChild(el("span","chip " + v.c, v.t));
    }
    c.appendChild(el("div","m", meaning));
    host.appendChild(c);
  }

  var dW = (B.watts/A.watts - 1) * 100;
  var dJ = (B.jps/A.jps - 1) * 100;
  var dR = (B.spm/A.spm - 1) * 100;
  var dM = (B.mps/A.mps - 1) * 100;

  card("Faster?", "Power", B.watts.toFixed(0) + " W",
    pctStr(dW) + "  ·  " + paceStr(B.pace), Math.abs(dW) < 2 ? 0 : dW, 1,
    "Watts and pace are the same measurement. This one follows the plan as much as it follows you — " +
    "the cards beside it are the ones that don't.");

  card("Stronger?", "Work per stroke", B.jps.toFixed(0) + " J",
    pctStr(dJ), Math.abs(dJ) < 2 ? 0 : dJ, 1,
    "How much work each stroke does. Rising here is the stroke itself getting stronger.");

  card("Quicker or bigger?", "Stroke rate", "r" + B.spm.toFixed(1),
    pctStr(dR), Math.abs(dR) < 1.5 ? 0 : dR, -1,
    "Turnover. Rising rate with a flat stroke means you are buying power rather than building it.");

  card("Longer?", "Metres per stroke", B.mps.toFixed(2) + " m",
    pctStr(dM), Math.abs(dM) < 1.5 ? 0 : dM, 1,
    "How far each stroke carries you. Falls when the rate climbs faster than the stroke does.");

  var eA = mean(hv.a.map(econOf).filter(function(v){ return v != null; }));
  var eB = mean(hv.b.map(econOf).filter(function(v){ return v != null; }));
  if(S.econ){
    var de = eB - eA;
    card("More efficient?", "Strokes vs expected",
      (eB >= 0 ? "+" : "−") + Math.abs(eB).toFixed(2) + " spm",
      (de >= 0 ? "+" : "−") + Math.abs(de).toFixed(2) + " spm since the first half",
      Math.abs(de) < 0.15 ? 0 : de, -1,
      "Rate against what that power normally costs you, so it ignores how hard the session was " +
      "prescribed. Below zero means fewer strokes than your own norm.");
  }

  var withHR = list.filter(function(s){ return s.hrAvg > 0; });
  if(withHR.length >= 4){
    var hA = groupMean(withHR.slice(0, Math.floor(withHR.length/2)));
    var hB = groupMean(withHR.slice(-Math.floor(withHR.length/2)));
    var jbA = mean(withHR.slice(0, Math.floor(withHR.length/2))
                 .map(function(s){ return s.watts/(s.hrAvg/60); }));
    var jbB = mean(withHR.slice(-Math.floor(withHR.length/2))
                 .map(function(s){ return s.watts/(s.hrAvg/60); }));
    var dh = (jbB/jbA - 1) * 100;
    card("Fitter?", "Work per heartbeat", jbB.toFixed(1) + " J",
      pctStr(dh), Math.abs(dh) < 2 ? 0 : dh, 1,
      "Watts carried per beat. The one metric here that is pure aerobic fitness — " +
      "it rises when the same power costs you fewer heartbeats.");
  } else {
    card("Fitter?", "Work per heartbeat", "—", null, 0, 1,
      "Needs heart rate in the sync. Pair the strap to the PM5, or send the Apple Health " +
      "export and this fills in for every session it covers.", true);
  }

  cav.textContent = "First " + hv.a.length + " sessions (" + fmtDay(hv.a[0].date) + " – " +
    fmtDay(hv.a[hv.a.length-1].date) + ") against the last " + hv.b.length + " (" +
    fmtDay(hv.b[0].date) + " – " + fmtDay(hv.b[hv.b.length-1].date) + ")." +
    (S.pillar === "all"
      ? "  This tab mixes sprint, VO₂ and threshold work, so power moves with the mix as much as " +
        "with you. The per-pillar tabs are the comparison that means something."
      : "  Same pillar throughout, so the prescriptions are broadly comparable.");
  var secs = list.map(ivSecs).filter(function(v){ return v > 0; });
  if(secs.length){
    cav.textContent += "  Reps in this group run " +
      mmssShort(Math.min.apply(null, secs)) + " to " + mmssShort(Math.max.apply(null, secs)) +
      ", so the like-for-like line on each session is the sharper comparison.";
  }
}

function renderSplit(){
  var list = inPillar();
  var lede = document.getElementById("splitLede");
  var bar = document.getElementById("splitBar");
  var key = document.getElementById("splitKey");
  var cap = document.getElementById("splitCap");
  lede.textContent = ""; bar.textContent = ""; key.textContent = ""; cap.textContent = "";
  var hv = halves(list);
  var d = hv && decompose(groupMean(hv.a), groupMean(hv.b));
  if(!d){ lede.textContent = "Not enough sessions in this group yet."; return; }

  lede.appendChild(document.createTextNode("Power "));
  lede.appendChild(el("b", null, pctStr(d.power)));
  lede.appendChild(document.createTextNode(" across this block, and it breaks down exactly: the stroke contributed "));
  lede.appendChild(el("b", null, pctStr(d.stroke)));
  lede.appendChild(document.createTextNode(", turnover contributed "));
  lede.appendChild(el("b", null, pctStr(d.rate)));
  lede.appendChild(document.createTextNode("."));

  /* signed bars from a zero line: stroke and rate often pull opposite ways,
     and a stacked bar would imply they add up when they do not */
  var max = Math.max(Math.abs(d.power), Math.abs(d.stroke), Math.abs(d.rate), 1);
  function row(label, val, color){
    var r = el("div","brow");
    r.appendChild(el("div","bl", label));
    var t = el("div","bt");
    t.appendChild(el("div","bz"));
    var f = el("div","bf");
    f.style.background = color;
    f.style.width = (Math.abs(val)/max*50) + "%";
    if(val >= 0) f.style.left = "50%"; else f.style.right = "50%";
    t.appendChild(f);
    r.appendChild(t);
    r.appendChild(el("div","bv", pctStr(val)));
    bar.appendChild(r);
  }
  row("Power", d.power, SER.power);
  row("Work per stroke", d.stroke, SER.stroke);
  row("Stroke rate", d.rate, SER.rate);
  key.textContent = "Percent change, first half of the block to second. The centre line is no " +
    "change; power is what the other two multiply out to.";

  var M = {
    "up-stroke": "The extra power is coming from the stroke rather than from turnover. That is the " +
      "version of progress that keeps paying as the pieces get longer.",
    "up-rate": "The extra power is coming from turnover rather than from the stroke. It works, but it " +
      "runs out of room first — there is a ceiling on rate and none on force.",
    "up-both": "Both sides are up. Real gain, with some of it borrowed from rate; watch whether the " +
      "stroke keeps its share as the block gets harder.",
    "down-rate": "Power is down and almost all of it is turnover — each stroke is still doing the same " +
      "work, you are simply taking fewer of them. That is usually lighter prescriptions rather than " +
      "anything lost.",
    "down-stroke": "Power is down and it is the stroke doing less work, not the rate. That is the one " +
      "worth taking seriously.",
    "down-both": "Power, stroke and rate are all down. Check what was prescribed across these weeks " +
      "before reading it as form.",
    "traded-up": "More work in every stroke, on fewer strokes. That is the cleanest reading available " +
      "in this data.",
    "traded-down": "The stroke has given ground and rate has covered for it. This is the one " +
      "combination worth correcting deliberately.",
    "mixed": "Power held while the mix underneath it changed — worth reading the two bars above " +
      "rather than the clock.",
    "flat": "Neither side has moved much. Whatever the clock did over this block, the stroke behind " +
      "it is the same one.",
    "none": ""
  };
  var msg = M[carriedBy(d)] || "";
  if(S.pillar === "test")
    msg = "These are one-off benchmarks rather than a series — a 100m sprint and a 20-minute piece " +
          "sit in the same tab, so the block-level split above means very little. Read them one " +
          "session at a time.";
  cap.appendChild(el("b", null, "Reading: "));
  cap.appendChild(document.createTextNode(msg));
}

}

/* the most comparable earlier session - interval duration decides, an exact
   plan key beats everything, total distance is irrelevant */
function comparableFor(s){
  var want = ivSecs(s), best = null, score = 0;
  S.sessions.forEach(function(o){
    if(o.date >= s.date) return;
    var sc;
    if(s.key && o.key === s.key) sc = 3;
    else {
      var a = ivSecs(o);
      if(!a || !want) return;
      var r = Math.min(a, want) / Math.max(a, want);
      if(r < 0.65) return;
      sc = r * (o.pillar === s.pillar ? 1 : 0.75);
    }
    if(sc > score || (sc === score && best && o.date > best.date)){ score = sc; best = o; }
  });
  return best ? {s: best, exact: !!(s.key && best.key === s.key)} : null;
}

function renderReads(s, reps, host){
  function line(label, build){
    var w = el("div","rd");
    w.appendChild(el("div","rk", label));
    var v = el("div","rv"); build(v); w.appendChild(v);
    host.appendChild(w);
  }
  function txt(v,t){ v.appendChild(document.createTextNode(t)); }
  function num(v,t){ v.appendChild(el("em",null,t)); }
  function str(v,t){ v.appendChild(el("b",null,t)); }

  var bands = (s.band || "").match(/(\d+):(\d\d(?:\.\d)?)/g);
  line("Pace", function(v){
    num(v, paceStr(s.pace)); txt(v, " average, "); num(v, s.pct.toFixed(1) + "% of PB");
    if(bands && bands.length === 2){
      var lo = paceSec(bands[0]), hi = paceSec(bands[1]);
      txt(v, ". Target " + s.band + " — ");
      if(s.pace < lo) str(v, (lo - s.pace).toFixed(1) + " s/500m hotter than the quick end");
      else if(s.pace > hi) str(v, (s.pace - hi).toFixed(1) + " s/500m softer than the easy end");
      else str(v, "inside it, " + ((s.pace-lo)/(hi-lo)*100).toFixed(0) + "% of the way down the band");
      txt(v, ".");
    } else if(s.band){ txt(v, ". Target " + s.band + "."); }
  });

  line("The stroke", function(v){
    num(v, s.jps.toFixed(0) + " J"); txt(v, " of work in every stroke at ");
    num(v, "r" + s.spm.toFixed(1)); txt(v, ", carrying "); num(v, s.mps.toFixed(2) + " m");
    txt(v, ". ");
    var e = econOf(s);
    if(e != null){
      txt(v, "For " + s.watts.toFixed(0) + " W that usually costs you r" +
        S.econ.expected(s.watts).toFixed(1) + ", so this was ");
      str(v, (e <= -0.4 ? Math.abs(e).toFixed(1) + " strokes a minute cheaper than your norm"
        : (e >= 0.4 ? e.toFixed(1) + " strokes a minute more expensive than your norm"
                    : "right on your norm")));
      txt(v, ".");
    }
  });

  var first = reps[0], last = reps[reps.length-1];
  line("Held together?", function(v){
    txt(v, "Fastest to slowest rep spans "); num(v, s.spread.toFixed(1) + " s");
    txt(v, ", length went from "); num(v, first.mps.toFixed(2) + " m");
    txt(v, " to "); num(v, last.mps.toFixed(2) + " m"); txt(v, ". ");
    var dl = last.mps - first.mps;
    str(v, dl < -0.3 ? "The stroke shortened noticeably by the end."
      : (dl > 0.15 ? "Length grew as the piece went on."
                   : "Length held from the first rep to the last."));
  });

  if(s.hrMax){
    line("Heart rate", function(v){
      txt(v, "Peaked "); num(v, s.hrMax + " bpm");
      txt(v, ", "); num(v, Math.round(s.hrMax/VT2*100) + "% of VT2");
      if(s.hrAvg){
        txt(v, "; average "); num(v, s.hrAvg.toFixed(0) + " bpm");
        txt(v, " carried "); num(v, (s.watts/(s.hrAvg/60)).toFixed(1) + " J per beat");
      }
      txt(v, ". ");
      str(v, s.hrMax >= VT2 + 6 ? "Over threshold."
        : (s.hrMax >= VT2 - 4 ? "Right at threshold." : "Under threshold throughout."));
    });
  }

  var cmp = comparableFor(s);
  if(cmp){
    var o = cmp.s, dd = decompose(o, s);
    line("Versus " + fmtDay(o.date), function(v){
      txt(v, cmp.exact ? "Same session (" + o.shape + "). "
        : "Closest earlier match by interval length — " + o.shape + ", " +
          mmssShort(ivSecs(o)) + " reps against " + mmssShort(ivSecs(s)) + " here. ");
      if(dd){
        txt(v, "Power "); num(v, pctStr(dd.power));
        txt(v, " — stroke "); num(v, pctStr(dd.stroke));
        txt(v, ", rate "); num(v, pctStr(dd.rate)); txt(v, ". ");
        str(v, dd.stroke > 1.5 && dd.rate <= 1
          ? "More power out of a bigger stroke. That is the improvement you want."
          : (dd.rate > 1.5 && dd.stroke <= 1
             ? "More power out of more strokes. The stroke itself has not changed."
             : (dd.stroke < -1.5
                ? "The stroke is doing less than it did that day."
                : "Broadly a repeat of that session.")));
      }
    });
  }
  if(s.note) line("Sync note", function(v){ txt(v, s.note); });
}

/* ---------- deep link + boot ---------- */
function fromHash(){
  var w = (location.hash || "").replace(/^#/, "");
  if(!/^\d{4}-\d{2}-\d{2}$/.test(w)) return null;
  return S.sessions.filter(function(s){ return s.date === w; })[0] || null;
}
function scrollToDetail(){
  var d = document.getElementById("detail");
  if(d && d.scrollIntoView) d.scrollIntoView({behavior:"smooth", block:"start"});
}
function render(){
  renderTabs();
  renderScore();
  renderSplit();
  renderCharts();
  renderTable();
  renderDetail();
}
function boot(){
  Promise.all([
    fetch("sync/results.json",   {cache:"no-store"}).then(function(r){ return r.json(); }),
    fetch("sync/intervals.json", {cache:"no-store"}).then(function(r){ return r.json(); }),
    fetch("sync/pillars.json",   {cache:"no-store"}).then(function(r){ return r.json(); })
  ]).then(function(a){
    S.sessions = build(a[0], a[1], a[2]);
    S.econ = fitEconomy(S.sessions);
    var last = S.sessions[S.sessions.length-1];
    var hit = fromHash();
    S.sel = hit ? hit.date : (last ? last.date : null);
    if(hit) S.pillar = hit.pillar;
    var h = document.getElementById("hdr");
    h.textContent = "";
    h.appendChild(document.createTextNode(
      S.sessions.length + " sessions" + (last ? ", through " + fmtDay(last.date) : "") +
      "  ·  rebuilt by the 9am logbook sync  ·  "));
    var a1 = document.createElement("a");
    a1.href = "block.html"; a1.textContent = "back to the console";
    h.appendChild(a1);
    render();
    if(hit) scrollToDetail();
    window.addEventListener("hashchange", function(){
      var w = fromHash();
      if(!w) return;
      S.sel = w.date; S.pillar = w.pillar;
      render(); scrollToDetail();
    });
  }).catch(function(e){
    document.getElementById("hdr").textContent =
      "Could not load the sync files (" + e.message + ").";
  });
}
boot();
</script>
