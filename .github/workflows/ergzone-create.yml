name: ErgZone create workouts

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "probe | dry | apply | index"
        type: choice
        options: [probe, dry, apply, index]
        default: probe

permissions:
  contents: write

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Create workouts
        env:
          ERGZONE_TOKEN: ${{ secrets.ERGZONE_TOKEN }}
        run: |
          set -o pipefail
          python pipeline/ergzone_create.py --${{ inputs.mode }} 2>&1 | tee pipeline/ergzone_last_run.txt
      - name: Commit the run log
        if: always()
        run: |
          git config user.name "ergzone-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pipeline/ergzone_last_run.txt || true
          git diff --cached --quiet || git commit -m "ErgZone run log (${{ inputs.mode }})"
          git push || true
