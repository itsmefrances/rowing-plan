name: HubFit fetch
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright
        run: |
          pip install playwright --quiet
          python -m playwright install --with-deps chromium
      - name: Recon
        env:
          HUBFIT_USER: ${{ secrets.HUBFIT_USER }}
          HUBFIT_CODE: ${{ secrets.HUBFIT_CODE }}
        run: python pipeline/hubfit_fetch.py
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hubfit-recon
          path: recon_out/
          retention-days: 3
