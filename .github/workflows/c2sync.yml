name: Concept2 logbook sync

on:
  schedule:
    - cron: "0 13 * * *"   # 9:00am US Eastern (EDT); becomes 8:00am after the November DST change
  workflow_dispatch:
    inputs:
      debug:
        description: "Verbose page dump for parser debugging"
        type: boolean
        default: false
      inspect:
        description: "Workout ID to inspect (prints per-interval splits, no sync)"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: c2sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync logbook
        run: |
          if [ -n "${{ inputs.inspect }}" ]; then
            python sync/sync_c2.py --inspect "${{ inputs.inspect }}"
          elif [ "${{ inputs.debug }}" = "true" ]; then
            python sync/sync_c2.py --debug
          else
            python sync/sync_c2.py
          fi

      - name: Stroke data (Concept2 API)
        if: ${{ !inputs.inspect }}
        env:
          C2_TOKEN: ${{ secrets.C2_TOKEN }}
        run: python sync/strokes_c2.py

      - name: Commit & push if changed
        run: |
          git add -N sync/strokes 2>/dev/null || true
          if git diff --quiet; then
            echo "No changes."
          else
            git config user.name "c2-sync-bot"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add index.html sync/results.json sync/intervals.json sync/pillars.json sync/strokes
            git commit -m "Daily logbook sync: Concept2 results, intervals and stroke data"
            git push
          fi
